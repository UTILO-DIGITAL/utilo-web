<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Utilo</title>
<!-- T0386: la plataforma interna de Utilo sobre Supabase (clientes/utilo/plataforma de utilo-apps), sin Apps Script: el marco
     del núcleo 5.0 entra con Google por Supabase (nucleo/acceso-supabase.js) y las secciones leen y escriben la gestión con
     la capa de tablas (nucleo/supabase.js). montaje.js lo escribe node herramientas/montar.js utilo/plataforma --web.
     Convive con el kanban 4.x (utilo/index.html) hasta que el DAILY pase a producción (T0402). Iconos, los de utilo/. -->
<!-- T0424: background_color del manifest, el verde de la marca: con él pinta el iPhone (iOS 26) la franja de la hora de la app
     instalada (con el crema salía crema y difuminada hacia la cabecera). Se lee al añadirla a la pantalla de inicio. -->
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="../icono-180.png?v=2">
<link rel="icon" href="../icono-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Utilo">
<!-- T0430: SIN apple-mobile-web-app-status-bar-style. Desde iOS 26.1, con black-translucent iOS pinta su propio degradado
     sobre la franja de la hora (no se quita desde la página) y da a la app instalada una ventana más corta que la pantalla,
     y la barra de secciones quedaba por encima del borde con un hueco debajo. Sin la etiqueta, la página empieza debajo de la
     hora, la ventana mide lo que se ve y la franja toma el color del fondo de la página (el verde de arriba del body).
     Probado en el iPhone de Javi (iOS 27.2) con dev/barra3/. iOS la lee al añadir la app: hay que quitarla y volver a añadirla. -->
<meta name="theme-color" content="#0E8A7A">
<link rel="stylesheet" href="../marca.css?v=47">
<link rel="stylesheet" href="../../estilos/base.css?v=92">
<!-- T0386: como una aplicación: deslizar el dedo de lado no lleva a la página de atrás (en el iPhone, eso solo instalada) -->
<style>html, body { overscroll-behavior-x: none; }
  html { background: #0E8A7A; overscroll-behavior-y: none; }
  /* La franja de la hora del iPhone (app instalada) toma el color del fondo de la página: el body, que es el que se desplaza en
     el móvil, va verde en su mitad de arriba y crema en la de abajo; #sx-panel tapa con el crema lo de debajo. Solo con la app
     abierta (u-con-barra, T0429): en la pantalla de entrar no hay nada que lo tape y saldría media pantalla verde. */
  @media (max-width: 899px) { body.u.u-con-barra { background: linear-gradient(#0E8A7A, #0E8A7A) top / 100% 50% no-repeat, var(--color-fondo); } }
  #sx-panel { min-height: 100%; box-sizing: border-box; background: var(--color-fondo); }
</style>
<script>
  window.KANBAN = {
    clave: 'utilo-plataforma',
    marca: 'utilo',
    nombreApp: 'Utilo',
    supabase: true
  };
</script>
</head>
