<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Utilo</title>
<!-- T0386: la plataforma interna de Utilo sobre Supabase (clientes/utilo/plataforma de utilo-apps), sin Apps Script: el marco
     del núcleo 5.0 entra con Google por Supabase (nucleo/acceso-supabase.js) y las secciones leen y escriben la gestión con
     la capa de tablas (nucleo/supabase.js). montaje.js lo escribe node herramientas/montar.js utilo/plataforma --web.
     Convive con el kanban 4.x (utilo/index.html) hasta que el DAILY pase a producción (T0402). Iconos, los de utilo/. -->
<!-- T0424: background_color del manifest, el verde de la marca: con él pinta el iPhone (iOS 26) la franja de la hora de la app
     instalada (con el crema salía crema y difuminada hacia la cabecera). Se lee al añadirla a la pantalla de inicio. -->
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="../icono-180.png?v=2">
<link rel="icon" href="../icono-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Utilo">
<!-- T0424: instalada en el iPhone, la página llega por debajo de la hora y la isla (black-translucent) y todo lo que queda
     ahí debajo es verde, como en la prueba de DEV (dev/barra/) que Javi vio bien en iOS 26: el body (que es el que se desplaza
     en el móvil) lleva el verde arriba, una franja verde fija tapa la zona de la hora al desplazar, y la página empieza
     debajo. Fuera del iPhone, env(safe-area-inset-top) mide 0 y no cambia nada. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E8A7A">
<link rel="stylesheet" href="../marca.css?v=47">
<link rel="stylesheet" href="../../estilos/base.css?v=91">
<!-- T0386: como una aplicación: deslizar el dedo de lado no lleva a la página de atrás (en el iPhone, eso solo instalada) -->
<style>html, body { overscroll-behavior-x: none; }
  /* T0424: la barra de la hora del iPhone, integrada (ver la etiqueta black-translucent de arriba). */
  html { background: #0E8A7A; overscroll-behavior-y: none; }
  /* En el móvil el body es el que se desplaza (alto de la pantalla): verde arriba, y #sx-panel tapa con el crema lo de debajo. */
  @media (max-width: 899px) { body.u { background: linear-gradient(#0E8A7A, #0E8A7A) top / 100% 50% no-repeat, var(--color-fondo); } }
  body.u::before { content: ''; position: fixed; z-index: 1000; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px);
    background: #0E8A7A; pointer-events: none; }
  #sx-panel { min-height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); background: var(--color-fondo); }
  #sx-panel > .n-cab:first-child { margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + var(--e4)); }
  html .u .u-velo, html .u .gs5 .gs-velo, html .u #alta-velo, html .u .ver-velo, html .u .sol-velo, html .u .fv-velo, html .u .kz {
    top: calc(var(--tope, 0px) + env(safe-area-inset-top, 0px)); }</style>
<script>
  window.KANBAN = {
    clave: 'utilo-plataforma',
    marca: 'utilo',
    nombreApp: 'Utilo',
    supabase: true
  };
</script>
</head>
