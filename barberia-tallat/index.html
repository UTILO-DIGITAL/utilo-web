<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Barbería Tallat</title>
<!--
  Demo navegable de Utilo para visitas a barberías · T0029
  Barbería inventada, datos inventados. Nada se guarda ni se envía: todo vive en esta página.
  Menú de la demo: pulsación larga en el logo (o la tecla M).
  Orden de carga del PROTOCOLO DISEÑO UTILO: marca.css → ../estilos/base.css.
  Los estilos de abajo son solo de esta demo y usan las variables de la marca (sin HEX).
-->
<link rel="stylesheet" href="marca.css">
<link rel="stylesheet" href="../estilos/base.css">
<style>
/* Composición: una columna en el móvil; en el ordenador, paso + resumen de la cita y agenda en tres columnas (una por barbero) */
.tl-in { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabecera con el rótulo y la franja del poste (el recurso propio de la marca, una vez por pantalla) */
.tl-cab { background: var(--color-principal); color: var(--color-sobre-principal); padding-top: env(safe-area-inset-top, 0px); }
.tl-cab-in { display: flex; align-items: center; justify-content: space-between; gap: var(--e3); padding-block: var(--e2); }
.tl-logo { display: flex; flex-direction: column; justify-content: center; min-height: 48px; padding: 0; border: 0; background: none;
  color: inherit; text-align: left; cursor: pointer; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.tl-logo-nom { font: var(--peso-titulos) 34px/0.95 var(--fuente-titulos); letter-spacing: .08em; text-transform: uppercase; }
.tl-logo-sub { font: 700 12px/1.3 var(--fuente-texto); letter-spacing: .08em; text-transform: uppercase; }
.tl-cab-info { margin: 0; font-size: 13px; text-align: right; }
.tl-poste { display: block; width: 100%; height: 6px; }
.tl-poste .p1 { fill: var(--color-accion); } .tl-poste .p2 { fill: var(--color-sobre-principal); } .tl-poste .p3 { fill: var(--color-principal); }

.tl-main { padding-block: var(--e5) var(--e7); }
.u .tl-main h1 { font-size: 30px; color: var(--color-principal); text-wrap: balance; }
.u .tl-main h2 { font-size: 22px; color: var(--color-principal); }
.tl-cabeza { display: flex; flex-direction: column; gap: var(--e1); margin-bottom: var(--e4); }
.tl-cabeza p { margin: 0; }
.tl-atras { align-self: flex-start; margin-left: calc(-1 * var(--e2)); }
.tl-pie { margin-top: var(--e6); }

/* Paso + resumen */
.tl-paso-grid { display: grid; gap: var(--e6); }
.tl-paso-grid > * { min-width: 0; }
.tl-aside { display: none; }
.tl-resumen-linea { display: flex; flex-wrap: wrap; gap: var(--e1) var(--e2); margin: 0 0 var(--e4); }
@media (min-width: 900px) {
  .tl-paso-grid { grid-template-columns: minmax(0, 1fr) 320px; gap: var(--e7); align-items: start; }
  .tl-aside { display: block; position: sticky; top: var(--e5); }
  .tl-resumen-linea { display: none; }
}
.tl-resumen h2 { margin-bottom: var(--e3); }
.tl-resumen dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--e2) var(--e4); margin: 0; }
.tl-resumen dt { font: 700 12px/1.6 var(--fuente-texto); color: var(--color-principal-oscuro); text-transform: uppercase; letter-spacing: .02em; }
.tl-resumen dd { margin: 0; font-weight: 700; }
.tl-resumen .vacio { color: var(--color-suave); font-weight: 400; }

/* Listas de servicios y barberos */
.tl-lista { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-linea); }
.tl-lista button { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--e1) var(--e4); width: 100%;
  min-height: 64px; padding: var(--e3) var(--e2); border: 0; border-bottom: 1px solid var(--color-linea); background: transparent;
  color: var(--color-texto); font: inherit; text-align: left; cursor: pointer; }
.tl-lista button:hover { background: var(--color-bloque); }
.tl-lista .nom { font-weight: 700; font-size: 17px; }
.tl-lista .det { grid-column: 1; font-size: 13px; color: var(--color-suave); }
.tl-lista .eur { grid-row: 1 / span 2; grid-column: 2; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; text-align: right; }
.tl-lista svg { grid-row: 1 / span 2; grid-column: 2; color: var(--color-principal-oscuro); }

/* Día y hora */
.tl-dias { display: flex; gap: var(--e2); overflow-x: auto; padding-bottom: var(--e2); margin-bottom: var(--e4); scrollbar-width: thin; }
.tl-dia { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; min-height: 64px;
  border: 1.5px solid var(--color-borde-campo); border-radius: var(--radio); background: var(--color-superficie); color: var(--color-texto);
  font: inherit; cursor: pointer; }
.tl-dia .dn { font: 700 12px/1.2 var(--fuente-texto); text-transform: uppercase; letter-spacing: .04em; }
.tl-dia .dd { font: var(--peso-titulos) 22px/1 var(--fuente-titulos); font-variant-numeric: tabular-nums; }
.tl-dia[aria-pressed=true] { background: var(--color-principal); border-color: var(--color-principal); color: var(--color-sobre-principal); }
.tl-franja { margin: 0 0 var(--e2); }
.tl-horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: var(--e2); margin-bottom: var(--e5); }
.tl-hora { min-height: 44px; border: 1.5px solid var(--color-principal-oscuro); border-radius: var(--radio); background: var(--color-superficie);
  color: var(--color-principal-oscuro); font: 700 15px/1 var(--fuente-texto); font-variant-numeric: tabular-nums; cursor: pointer; }
.tl-hora:hover { background: var(--color-bloque); }

/* Datos */
.tl-form { display: flex; flex-direction: column; gap: var(--e4); max-width: 480px; }
.tl-form input:not([type=checkbox]) { width: 100%; }
.tl-check { display: flex; gap: var(--e3); align-items: flex-start; font-size: 14px; }
.tl-check input { margin-top: 2px; flex: none; }
.tl-form .u-btn-accion { align-self: stretch; }
@media (min-width: 640px) { .tl-form .u-btn-accion { align-self: flex-start; } }
.tl-acciones { display: flex; flex-wrap: wrap; gap: var(--e3); margin-top: var(--e5); }

/* Cita reservada */
.tl-hecho dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--e2) var(--e4); margin: var(--e4) 0 0; padding: var(--e4) 0;
  border-block: 1px solid var(--color-linea); }
.tl-hecho dt { font: 700 12px/1.6 var(--fuente-texto); color: var(--color-principal-oscuro); text-transform: uppercase; letter-spacing: .02em; }
.tl-hecho dd { margin: 0; font-weight: 700; }

/* Aviso que llega al móvil (flota: lleva la única sombra) */
.tl-noti { position: fixed; z-index: 80; top: calc(var(--e2) + env(safe-area-inset-top, 0px));
  left: calc(var(--e2) + env(safe-area-inset-left, 0px)); right: calc(var(--e2) + env(safe-area-inset-right, 0px));
  max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--e1) var(--e3); align-items: start;
  padding: var(--e3); border: 1px solid var(--color-linea); border-radius: var(--radio); background: var(--color-superficie);
  color: var(--color-texto); box-shadow: var(--sombra-flota); font: inherit; text-align: left; cursor: pointer;
  transform: translateY(calc(-100% - 24px)); transition: transform 200ms ease-out; }
.tl-noti.on { transform: none; }
.tl-noti[hidden] { display: none; }
.tl-noti .app { grid-row: 1 / span 2; }
.tl-noti .tit { display: flex; justify-content: space-between; gap: var(--e2); font-size: 13px; }
.tl-noti .tit span { color: var(--color-suave); }
.tl-noti .txt { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-av { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--radio);
  background: var(--color-principal); color: var(--color-sobre-principal); font: var(--peso-titulos) 22px/1 var(--fuente-titulos); }

/* Chat simulado: neutro, sin la marca ni los colores de ninguna app de mensajería */
.tl-chat { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--color-bloque); }
.tl-chat-cab { display: flex; align-items: center; gap: var(--e3); padding: calc(var(--e2) + env(safe-area-inset-top, 0px)) var(--e3) var(--e2);
  background: var(--color-superficie); border-bottom: 1px solid var(--color-linea); }
.tl-chat-cab strong { display: block; }
.tl-chat-cab div span { font-size: 13px; color: var(--color-suave); }
.tl-msgs { flex: 1; display: flex; flex-direction: column; gap: var(--e3); padding: var(--e4) var(--e3); }
.tl-sis { align-self: center; max-width: 90%; padding: var(--e1) var(--e3); border-radius: var(--radio-peq); background: var(--color-fondo);
  color: var(--color-suave); font-size: 13px; text-align: center; }
.tl-msg { max-width: 86%; padding: var(--e2) var(--e3); border-radius: var(--radio); font-size: 15px; white-space: pre-line; }
.tl-msg time { display: block; margin-top: var(--e1); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.tl-msg.neg { align-self: flex-start; background: var(--color-superficie); }
.tl-msg.neg time { color: var(--color-suave); }
.tl-msg.cli { align-self: flex-end; background: var(--color-principal); color: var(--color-sobre-principal); }
.tl-resp { display: flex; flex-wrap: wrap; gap: var(--e2); padding: var(--e3); padding-bottom: calc(var(--e3) + env(safe-area-inset-bottom, 0px));
  background: var(--color-superficie); border-top: 1px solid var(--color-linea); }
.tl-resp p { flex: 1 0 100%; margin: 0; }
.tl-resp .u-btn { flex: 1 1 0; padding: 0 var(--e2); }

/* Agenda de la barbería */
.tl-ag-cab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e3); margin-bottom: var(--e2); }
.tl-ag-nav { display: flex; gap: var(--e2); }
.tl-ag-sum { margin: 0 0 var(--e4); font-size: 15px; }
.tl-cifra { font-weight: 700; font-variant-numeric: tabular-nums; text-decoration: underline; text-decoration-color: var(--color-destacado);
  text-decoration-thickness: 4px; text-underline-offset: 4px; }
.tl-filtros { display: flex; flex-wrap: wrap; gap: var(--e2); margin-bottom: var(--e3); }
.tl-filtro { min-height: 44px; padding: 0 var(--e4); border: 1.5px solid var(--color-borde-campo); border-radius: var(--radio);
  background: var(--color-superficie); color: var(--color-texto); font: 700 14px/1 var(--fuente-texto); cursor: pointer; }
.tl-filtro[aria-pressed=true] { background: var(--color-principal); border-color: var(--color-principal); color: var(--color-sobre-principal); }
.tl-citas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-linea); }
.tl-cita { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 2px var(--e3); align-items: baseline;
  padding: var(--e3) var(--e2); border-bottom: 1px solid var(--color-linea); }
.tl-cita .h { font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-cita .c { font-weight: 700; min-width: 0; }
.tl-cita .e { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.tl-cita .d { grid-column: 2 / span 2; display: flex; flex-wrap: wrap; align-items: center; gap: var(--e1) var(--e2); font-size: 13px; color: var(--color-suave); }
.tl-cita.pasada .h, .tl-cita.pasada .c, .tl-cita.pasada .e { color: var(--color-suave); font-weight: 400; }
.tl-cita.libre .c { color: var(--color-suave); font-weight: 400; }
.tl-cita.nueva { background: var(--color-bloque); }
.tl-cita.nueva .d { color: var(--color-texto); }
.tl-cita.nueva .u-chip { background: var(--color-superficie); }
.tl-ag-cols { display: none; }
@media (min-width: 900px) {
  .tl-ag-movil { display: none; }
  .tl-ag-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e5); }
  .tl-ag-cols h2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--e2); }
  .tl-ag-cols h2 span { font: 400 13px/1 var(--fuente-texto); color: var(--color-suave); }
  .tl-ag-cols .tl-cita { grid-template-columns: 48px minmax(0, 1fr) auto; }
}

/* Menú de la demo */
.tl-menu { padding: var(--e5) var(--e4); display: flex; flex-direction: column; gap: var(--e3); }
.tl-menu h2 { font-size: 22px; color: var(--color-principal); }
.tl-menu p { margin: 0; }
.tl-menu .u-btn { width: 100%; justify-content: flex-start; }
@media (min-width: 641px) { .u .u-velo { align-items: center; } .u .u-ventana { max-width: 420px; } }
</style>
</head>
<body class="u">

<header class="tl-cab" id="cab">
  <div class="tl-in tl-cab-in">
    <button type="button" class="tl-logo" id="logo" aria-label="Barbería Tallat, Sant Antoni. Pulsación larga: menú de la demo">
      <span class="tl-logo-nom">Tallat</span>
      <span class="tl-logo-sub">Barbería · Sant Antoni</span>
    </button>
    <p class="tl-cab-info" id="cab-info">Martes a sábado<br>10:00 a 20:30</p>
  </div>
  <svg class="tl-poste" aria-hidden="true" preserveAspectRatio="none">
    <defs><pattern id="poste" width="24" height="6" patternUnits="userSpaceOnUse">
      <rect class="p2" width="24" height="6"/>
      <polygon class="p1" points="0,6 6,0 11,0 5,6"/>
      <polygon class="p3" points="12,6 18,0 23,0 17,6"/>
    </pattern></defs>
    <rect width="100%" height="6" fill="url(#poste)"/>
  </svg>
</header>

<main id="app" class="tl-main tl-in" aria-live="polite"></main>

<button type="button" class="tl-noti" id="noti" hidden>
  <span class="tl-av app" aria-hidden="true">T</span>
  <span class="tit"><strong>Barbería Tallat</strong><span>ahora</span></span>
  <span class="txt" id="noti-txt"></span>
</button>

<div class="u-velo" id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-tit">
  <div class="u-ventana tl-menu">
    <h2 id="menu-tit">Menú de la demo</h2>
    <p class="u-nota">Solo lo ves tú. Se abre con una pulsación larga en el logo.</p>
    <button type="button" class="u-btn" data-ir="servicio">Reservar como cliente</button>
    <button type="button" class="u-btn" data-ir="chat" id="menu-chat">Ver el aviso que recibe el cliente</button>
    <button type="button" class="u-btn" data-ir="agenda">Ver la agenda de la barbería</button>
    <button type="button" class="u-btn" data-ir="reiniciar">Reiniciar la demo</button>
    <button type="button" class="u-btn u-btn-texto" data-ir="cerrar">Cerrar el menú</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Datos de la barbería (inventados) ---------- */
  var SERV = [
    { id: 'corte',  nom: 'Corte',          min: 30, eur: 16, det: 'Tijera o máquina, con lavado' },
    { id: 'cb',     nom: 'Corte y barba',  min: 45, eur: 22, det: 'Con toalla caliente' },
    { id: 'barba',  nom: 'Barba',          min: 20, eur: 10, det: 'Arreglo y perfilado a navaja' },
    { id: 'rapado', nom: 'Rapado',         min: 20, eur: 12, det: 'Al cero o a un solo número' },
    { id: 'inf',    nom: 'Corte infantil', min: 30, eur: 13, det: 'Hasta 12 años' }
  ];
  var BARB = [
    { id: 'Toni',    det: 'Cortes clásicos y a tijera' },
    { id: 'Marc',    det: 'Barba y afeitado a navaja' },
    { id: 'Yassine', det: 'Degradados y diseños' }
  ];
  var NOMBRES = ['Oriol', 'Pau', 'Arnau', 'Jordi', 'Karim', 'Sergi', 'Iker', 'Bilal', 'Dani', 'Nil', 'Adrià', 'Youssef',
    'Víctor', 'Joan', 'Marcel', 'Hugo', 'Ricard', 'Pol', 'Aleix', 'Hamza', 'Enric', 'Lucas', 'Biel', 'Gerard', 'Xavi',
    'Rubén', 'Imran', 'Quim', 'Mateo', 'Albert', 'Eric', 'Martí', 'Abdel', 'Roger', 'Ivan', 'Jan', 'Samir', 'Carles',
    'Luis', 'Guillem'];
  var ABRE = 600, CIERRA = 1230, PASO = 30;   // minutos desde las 00:00: 10:00 a 20:30
  var DIA_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var DIA_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

  var ICO = {
    atras: '<svg class="u-icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    sig: '<svg class="u-icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
  };

  /* ---------- Utilidades ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dos(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(m) { return dos(Math.floor(m / 60)) + ':' + dos(m % 60); }
  function clave(d) { return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()); }
  function fecha(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function ddmm(k) { var d = fecha(k); return dos(d.getDate()) + '/' + dos(d.getMonth() + 1); }
  function diaLargo(k) { var d = fecha(k); return DIA_L[d.getDay()] + ' ' + dos(d.getDate()) + '/' + dos(d.getMonth() + 1) + '/' + d.getFullYear(); }
  function eur(n) { return n.toLocaleString('es-ES') + ' €'; }
  function serv(id) { return SERV.filter(function (s) { return s.id === id; })[0]; }
  function ahoraMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function hoy() { return clave(new Date()); }
  function abierto(d) { return d.getDay() >= 2 && d.getDay() <= 6; }
  function diasAbiertos(n) {
    var out = [], d = new Date(); d.setHours(12, 0, 0, 0);
    for (var i = 0; out.length < n && i < 21; i++) { if (abierto(d)) out.push(clave(d)); d.setDate(d.getDate() + 1); }
    return out;
  }
  function otroDiaAbierto(k, paso) {
    var d = fecha(k); d.setHours(12);
    do { d.setDate(d.getDate() + paso); } while (!abierto(d));
    return clave(d);
  }
  function mascara(tel) { return tel.charAt(0) + '•• ••• ' + tel.slice(-3); }

  /* Agenda inventada pero estable: la misma para cada día cada vez que se abre */
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function azar(seed) {
    var a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  var cache = {};
  function generadas(k) {
    if (cache[k]) return cache[k];
    var sab = fecha(k).getDay() === 6, out = [];
    /* Un nombre distinto para cada cita del día; si se acaban, con la inicial del apellido */
    var rn = azar(hash(k)), noms = NOMBRES.slice(), n = 0;
    for (var i = noms.length - 1; i > 0; i--) { var j = Math.floor(rn() * (i + 1)), x0 = noms[i]; noms[i] = noms[j]; noms[j] = x0; }
    function nombre() { var i = n++; return noms[i % noms.length] + (i >= noms.length ? ' ' + 'MPRGSTV'.charAt(i % 7) + '.' : ''); }
    BARB.forEach(function (b) {
      var r = azar(hash(k + b.id)), t = ABRE;
      while (t < CIERRA) {
        var p = sab ? 0.55 : (t < 750 || t >= 1050 ? 0.5 : 0.3);
        if (r() < p) {
          var x = r(), s = x < 0.45 ? SERV[0] : x < 0.7 ? SERV[1] : x < 0.8 ? SERV[2] : x < 0.9 ? SERV[3] : SERV[4];
          if (t + s.min <= CIERRA) {
            out.push({ dia: k, barbero: b.id, ini: t, serv: s.id, cliente: nombre() });
            t += Math.ceil(s.min / PASO) * PASO; continue;
          }
        }
        t += PASO;
      }
    });
    return (cache[k] = out);
  }
  function citasDe(k) {
    var l = generadas(k).slice();
    if (st.reserva && st.reserva.dia === k && !st.reserva.anulada) l.push(st.reserva);
    return l.sort(function (a, b) { return a.ini - b.ini || a.barbero.localeCompare(b.barbero); });
  }
  function pasada(k, ini) { return k === hoy() && ini <= ahoraMin() + 15; }
  function barberoLibre(k, b, ini, min) {
    if (ini + min > CIERRA || pasada(k, ini)) return false;
    return !citasDe(k).some(function (c) {
      return c.barbero === b && c.ini < ini + min && ini < c.ini + serv(c.serv).min;
    });
  }
  function libreQuien(k, b, ini, min) {
    var lista = b === '*' ? BARB.map(function (x) { return x.id; }) : [b];
    for (var i = 0; i < lista.length; i++) if (barberoLibre(k, lista[i], ini, min)) return lista[i];
    return null;
  }

  /* ---------- Estado de la demo ---------- */
  var st;
  function reiniciar() {
    st = { vista: 'servicio', serv: null, barb: null, dia: null, ini: null, nombre: '', tel: '', reserva: null,
      chat: [], agDia: null, agFiltro: 'todos', error: '' };
    ocultarNoti();
  }

  /* ---------- Vistas ---------- */
  var app = document.getElementById('app');
  var cab = document.getElementById('cab');
  var cabInfo = document.getElementById('cab-info');

  function cabeza(paso, nombre, titulo, atras) {
    return '<div class="tl-cabeza">' +
      (atras ? '<button type="button" class="u-btn u-btn-texto tl-atras" data-accion="atras">' + ICO.atras + 'Atrás</button>' : '') +
      '<p class="u-etiqueta">Paso ' + paso + ' de 4 · ' + nombre + '</p>' +
      '<h1>' + titulo + '</h1></div>';
  }
  function resumen() {
    var s = st.serv && serv(st.serv);
    function v(x) { return x ? esc(x) : '<span class="vacio">Sin elegir</span>'; }
    var barb = st.barb === '*' ? 'El primero libre' : st.barb;
    return '<aside class="tl-aside"><div class="u-bloque tl-resumen"><h2>Tu cita</h2><dl>' +
      '<dt>Servicio</dt><dd>' + v(s && s.nom) + '</dd>' +
      '<dt>Barbero</dt><dd>' + v(barb) + '</dd>' +
      '<dt>Día</dt><dd>' + v(st.dia && diaLargo(st.dia)) + '</dd>' +
      '<dt>Hora</dt><dd>' + v(st.ini != null && hhmm(st.ini)) + '</dd>' +
      '<dt>Precio</dt><dd>' + v(s && eur(s.eur)) + '</dd>' +
      '</dl></div></aside>';
  }
  function resumenLinea() {
    var p = [];
    if (st.serv) p.push(serv(st.serv).nom + ' · ' + eur(serv(st.serv).eur));
    if (st.barb) p.push(st.barb === '*' ? 'El primero libre' : 'Con ' + st.barb);
    if (st.dia) p.push(DIA_C[fecha(st.dia).getDay()] + ' ' + ddmm(st.dia) + (st.ini != null ? ' · ' + hhmm(st.ini) : ''));
    return p.length ? '<p class="tl-resumen-linea">' + p.map(function (x) { return '<span class="u-chip">' + esc(x) + '</span>'; }).join('') + '</p>' : '';
  }
  function paso(html) { return '<div class="tl-paso-grid"><div>' + html + '</div>' + resumen() + '</div>'; }
  var pie = '<p class="u-nota tl-pie">Demo de Utilo. La barbería y los datos son inventados; no se guarda ni se envía nada.</p>';

  function vServicio() {
    return paso(cabeza(1, 'Servicio', 'Pide cita', false) +
      '<p class="u-nota" style="margin:0 0 var(--e4)">Carrer de Manso, Sant Antoni · se paga en la barbería</p>' +
      '<ul class="tl-lista">' + SERV.map(function (s) {
        return '<li><button type="button" data-serv="' + s.id + '"><span class="nom">' + s.nom + '</span>' +
          '<span class="eur">' + eur(s.eur) + '</span><span class="det">' + s.min + ' min · ' + s.det + '</span></button></li>';
      }).join('') + '</ul>') + pie;
  }
  function vBarbero() {
    var filas = BARB.map(function (b) {
      return '<li><button type="button" data-barb="' + b.id + '"><span class="nom">' + b.id + '</span>' + ICO.sig +
        '<span class="det">' + b.det + '</span></button></li>';
    }).join('') + '<li><button type="button" data-barb="*"><span class="nom">Me da igual</span>' + ICO.sig +
      '<span class="det">Te damos la primera hora libre de los tres</span></button></li>';
    return paso(cabeza(2, 'Barbero', '¿Con quién?', true) + resumenLinea() + '<ul class="tl-lista">' + filas + '</ul>');
  }
  function vHora() {
    var dias = diasAbiertos(6), min = serv(st.serv).min, man = [], tar = [];
    function hayHora(k) { for (var t = ABRE; t + min <= CIERRA; t += PASO) if (libreQuien(k, st.barb, t, min)) return true; return false; }
    if (!st.dia || dias.indexOf(st.dia) < 0) st.dia = dias.filter(hayHora)[0] || dias[0];
    for (var t = ABRE; t + min <= CIERRA; t += PASO) {
      if (libreQuien(st.dia, st.barb, t, min)) (t < 840 ? man : tar).push(t);
    }
    function botones(l) { return '<div class="tl-horas">' + l.map(function (t) { return '<button type="button" class="tl-hora" data-hora="' + t + '">' + hhmm(t) + '</button>'; }).join('') + '</div>'; }
    var horas = !man.length && !tar.length
      ? '<p class="u-vacio">No quedan horas libres este día' + (st.barb !== '*' ? ' con ' + esc(st.barb) : '') + '. Prueba con otro día o elige «Me da igual» como barbero.</p>'
      : (man.length ? '<p class="u-etiqueta tl-franja">Mañana</p>' + botones(man) : '') + (tar.length ? '<p class="u-etiqueta tl-franja">Tarde</p>' + botones(tar) : '');
    return paso(cabeza(3, 'Día y hora', '¿Qué día te va bien?', true) + resumenLinea() +
      '<div class="tl-dias" role="group" aria-label="Día">' + dias.map(function (k) {
        var d = fecha(k);
        return '<button type="button" class="tl-dia" data-dia="' + k + '" aria-pressed="' + (k === st.dia) + '">' +
          '<span class="dn">' + (k === hoy() ? 'hoy' : DIA_C[d.getDay()]) + '</span><span class="dd">' + d.getDate() + '</span></button>';
      }).join('') + '</div>' + horas);
  }
  function vDatos() {
    var s = serv(st.serv);
    return paso(cabeza(4, 'Tus datos', 'Último paso', true) + resumenLinea() +
      '<form class="tl-form" id="f-datos" novalidate>' +
      '<label class="u-campo" for="f-nombre"><span class="u-etiqueta">Nombre</span>' +
      '<input id="f-nombre" name="nombre" autocomplete="given-name" placeholder="Cómo te llamamos" value="' + esc(st.nombre) + '"></label>' +
      '<label class="u-campo" for="f-tel"><span class="u-etiqueta">Móvil</span>' +
      '<input id="f-tel" name="tel" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="9 cifras, sin prefijo" value="' + esc(st.tel) + '"></label>' +
      '<label class="tl-check" for="f-ok"><input type="checkbox" id="f-ok">' +
      '<span>Acepto que Barbería Tallat guarde mi nombre y mi móvil para gestionar la cita y avisarme por WhatsApp. Se borran 30 días después de la cita.</span></label>' +
      (st.error ? '<p class="u-error" role="alert" style="margin:0">' + esc(st.error) + '</p>' : '') +
      '<button type="submit" class="u-btn u-btn-accion">Reservar cita · ' + eur(s.eur) + '</button>' +
      '</form>');
  }
  function vReservada() {
    var r = st.reserva, s = serv(r.serv);
    return '<div class="tl-hecho" style="max-width:560px">' +
      '<div class="tl-cabeza"><p class="u-etiqueta">Reserva hecha a las ' + r.hecha + '</p><h1>Cita reservada, ' + esc(r.cliente) + '</h1></div>' +
      '<p style="margin:0">Te llega ahora la confirmación por WhatsApp al ' + mascara(r.tel) + '. ' +
      (r.dia === hoy() ? 'Dos horas antes' : 'El día antes, a las 19:00,') + ' te mandamos un recordatorio.</p>' +
      '<dl><dt>Servicio</dt><dd>' + s.nom + ' · ' + s.min + ' min</dd><dt>Barbero</dt><dd>' + esc(r.barbero) + '</dd>' +
      '<dt>Día</dt><dd>' + diaLargo(r.dia) + '</dd><dt>Hora</dt><dd>' + hhmm(r.ini) + '</dd>' +
      '<dt>Precio</dt><dd>' + eur(s.eur) + ', se paga en la barbería</dd></dl>' +
      '<div class="tl-acciones"><button type="button" class="u-btn" data-accion="ver-chat">Ver la confirmación</button>' +
      '<button type="button" class="u-btn u-btn-texto" data-accion="otra">Pedir otra cita</button></div></div>' + pie;
  }
  function vChat() {
    if (!st.reserva) return '<div class="tl-cabeza"><h1>Todavía no hay aviso</h1></div><p class="u-vacio">El aviso llega cuando alguien reserva. Haz una reserva de prueba y vuelve aquí.</p>' +
      '<button type="button" class="u-btn" data-ir="servicio">Hacer una reserva</button>';
    var abiertaResp = !st.reserva.anulada && !st.chat.some(function (m) { return m.de === 'cli'; });
    return '<div class="tl-chat">' +
      '<div class="tl-chat-cab"><button type="button" class="u-btn u-btn-icono u-btn-texto" data-accion="atras" aria-label="Volver">' + ICO.atras + '</button>' +
      '<span class="tl-av" aria-hidden="true">T</span><div><strong>Barbería Tallat</strong><span>Cuenta de empresa · responde al momento</span></div></div>' +
      '<div class="tl-msgs" id="msgs"><p class="tl-sis">Simulación del WhatsApp que recibe el cliente</p>' +
      st.chat.map(function (m) {
        if (m.de === 'sis') return '<p class="tl-sis">' + esc(m.txt) + '</p>';
        return '<div class="tl-msg ' + m.de + '">' + esc(m.txt) + '<time>' + m.hora + '</time></div>';
      }).join('') + '</div>' +
      (abiertaResp ? '<div class="tl-resp" role="group" aria-labelledby="resp-tit"><p class="u-etiqueta" id="resp-tit">Responder al recordatorio como el cliente</p>' +
        '<button type="button" class="u-btn" data-resp="SÍ">SÍ</button>' +
        '<button type="button" class="u-btn" data-resp="CAMBIAR">CAMBIAR</button>' +
        '<button type="button" class="u-btn" data-resp="ANULAR">ANULAR</button></div>' : '') +
      '</div>';
  }
  function filaCita(c, conBarbero) {
    var s = serv(c.serv), cls = 'tl-cita' + (c.nueva ? ' nueva' : '') + (pasada(c.dia, c.ini + s.min - 16) ? ' pasada' : '');
    return '<li class="' + cls + '"><span class="h">' + hhmm(c.ini) + '</span><span class="c">' + esc(c.cliente) + '</span>' +
      '<span class="e">' + eur(s.eur) + '</span><span class="d">' + s.nom + ' · ' + s.min + ' min' +
      (conBarbero ? ' <span class="u-chip">' + c.barbero + '</span>' : '') +
      (c.nueva ? ' <span class="u-chip">Nueva · por la web</span> Aviso enviado al ' + mascara(c.tel) : '') + '</span></li>';
  }
  function filasBarbero(k, b) {
    var citas = citasDe(k).filter(function (c) { return c.barbero === b; }), out = [], t = ABRE;
    while (t < CIERRA) {
      var c = citas.filter(function (x) { return x.ini === t; })[0];
      if (c) { out.push(filaCita(c, false)); t += Math.ceil(serv(c.serv).min / PASO) * PASO; continue; }
      if (!pasada(k, t)) out.push('<li class="tl-cita libre"><span class="h">' + hhmm(t) + '</span><span class="c">Libre</span><span class="e"></span></li>');
      t += PASO;
    }
    return out;
  }
  function libres(k) {
    var n = 0;
    BARB.forEach(function (b) { for (var t = ABRE; t + PASO <= CIERRA; t += PASO) if (barberoLibre(k, b.id, t, PASO)) n++; });
    return n;
  }
  function vAgenda() {
    if (!st.agDia) st.agDia = st.reserva && !st.reserva.anulada ? st.reserva.dia : diasAbiertos(1)[0];
    var k = st.agDia, citas = citasDe(k);
    var total = citas.reduce(function (a, c) { return a + serv(c.serv).eur; }, 0);
    var titulo = k === hoy() ? 'Agenda de hoy' : 'Agenda del ' + DIA_L[fecha(k).getDay()] + ' ' + ddmm(k);
    var f = st.agFiltro;
    var movil = f === 'todos'
      ? (citas.length ? citas.map(function (c) { return filaCita(c, true); }).join('') : '')
      : filasBarbero(k, f).join('');
    return '<div class="tl-ag-cab"><h1>' + titulo + '</h1><div class="tl-ag-nav">' +
      '<button type="button" class="u-btn u-btn-icono" data-agdia="-1" aria-label="Día anterior">' + ICO.atras + '</button>' +
      '<button type="button" class="u-btn u-btn-icono" data-agdia="1" aria-label="Día siguiente">' + ICO.sig + '</button></div></div>' +
      '<p class="tl-ag-sum">' + diaLargo(k).replace(/^./, function (x) { return x.toUpperCase(); }) + ' · ' + citas.length + ' citas · ' +
      '<span class="tl-cifra">' + eur(total) + '</span> previstos · ' + libres(k) + ' huecos libres</p>' +
      '<div class="tl-ag-movil"><div class="tl-filtros" role="group" aria-label="Barbero">' +
      ['todos'].concat(BARB.map(function (b) { return b.id; })).map(function (x) {
        return '<button type="button" class="tl-filtro" data-filtro="' + x + '" aria-pressed="' + (f === x) + '">' + (x === 'todos' ? 'Todos' : x) + '</button>';
      }).join('') + '</div>' +
      (movil ? '<ul class="tl-citas">' + movil + '</ul>' : '<p class="u-vacio">No hay citas este día. Las reservas nuevas aparecen aquí en cuanto entran.</p>') + '</div>' +
      '<div class="tl-ag-cols">' + BARB.map(function (b) {
        var n = citas.filter(function (c) { return c.barbero === b.id; }).length;
        return '<section><h2>' + b.id + '<span>' + n + ' citas</span></h2><ul class="tl-citas">' + filasBarbero(k, b.id).join('') + '</ul></section>';
      }).join('') + '</div>' +
      '<p class="u-nota tl-pie">Vista de la barbería, en su móvil o en el ordenador del mostrador. Las citas de ejemplo son inventadas.</p>';
  }

  var VISTAS = { servicio: vServicio, barbero: vBarbero, hora: vHora, datos: vDatos, reservada: vReservada, chat: vChat, agenda: vAgenda };
  var ATRAS = { barbero: 'servicio', hora: 'barbero', datos: 'hora', chat: 'reservada' };

  function pintar(foco) {
    var esChat = st.vista === 'chat' && st.reserva;
    cab.hidden = !!esChat;
    app.classList.toggle('tl-in', !esChat);
    app.classList.toggle('tl-main', !esChat);
    cabInfo.innerHTML = st.vista === 'agenda' ? 'Vista de la barbería' : 'Martes a sábado<br>10:00 a 20:30';
    app.innerHTML = VISTAS[st.vista]();
    if (esChat) { var m = document.getElementById('msgs'); window.scrollTo(0, document.body.scrollHeight); if (m) m.lastElementChild.scrollIntoView({ block: 'end' }); }
    else if (foco !== false) window.scrollTo(0, 0);
  }
  function ir(v) { st.error = ''; st.vista = v; pintar(); }

  /* ---------- Aviso y chat ---------- */
  var noti = document.getElementById('noti'), notiTimer = null;
  function textoConfirmacion(r) {
    var s = serv(r.serv);
    return 'Hola ' + r.cliente + '. Tu cita en Barbería Tallat está confirmada:\n' + s.nom + ' con ' + r.barbero + '\n' +
      DIA_L[fecha(r.dia).getDay()] + ' ' + ddmm(r.dia) + ' a las ' + hhmm(r.ini) + '\n' + eur(s.eur) + ', se paga en la barbería.\n' +
      'Carrer de Manso, Sant Antoni.\nSi no puedes venir, responde CAMBIAR o ANULAR y dejamos el hueco a otro cliente.';
  }
  function textoRecordatorio(r) {
    var hoyEs = r.dia === hoy();
    return 'Hola ' + r.cliente + ', te recordamos tu cita de ' + (hoyEs ? 'hoy' : 'mañana') + ' a las ' + hhmm(r.ini) + ' con ' + r.barbero +
      '. Responde SÍ para confirmarla, o CAMBIAR o ANULAR si no puedes venir.';
  }
  function mostrarNoti() {
    if (!st.reserva) return;
    document.getElementById('noti-txt').textContent = textoConfirmacion(st.reserva);
    noti.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { noti.classList.add('on'); }); });
  }
  function ocultarNoti() { clearTimeout(notiTimer); noti.classList.remove('on'); noti.hidden = true; }
  noti.addEventListener('click', function () { ocultarNoti(); ir('chat'); });

  function responder(txt) {
    var r = st.reserva, h = hhmm(ahoraMin());
    st.chat.push({ de: 'cli', txt: txt, hora: h });
    var resp;
    if (txt === 'SÍ') resp = 'Perfecto, ' + r.cliente + '. Te esperamos el ' + DIA_L[fecha(r.dia).getDay()] + ' a las ' + hhmm(r.ini) + '.';
    else if (txt === 'CAMBIAR') resp = 'Sin problema. Elige otra hora en el enlace de reservas y te guardamos la nueva. La de las ' + hhmm(r.ini) + ' queda libre.';
    else { resp = 'Cita anulada. Hemos dejado libre el hueco de las ' + hhmm(r.ini) + ' para otro cliente. Gracias por avisar.'; r.anulada = true; }
    if (txt === 'CAMBIAR') r.anulada = true;
    st.chat.push({ de: 'neg', txt: resp, hora: h });
    st.chat.push({ de: 'sis', txt: r.anulada ? 'La agenda de la barbería ya muestra el hueco libre' : 'La agenda de la barbería marca la cita como confirmada' });
    pintar();
  }

  /* ---------- Eventos ---------- */
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var d = b.dataset;
    if (d.serv) { st.serv = d.serv; st.ini = null; ir('barbero'); }
    else if (d.barb) { st.barb = d.barb; st.ini = null; ir('hora'); }
    else if (d.dia) { st.dia = d.dia; st.ini = null; pintar(false); }
    else if (d.hora) { st.ini = +d.hora; ir('datos'); }
    else if (d.resp) responder(d.resp);
    else if (d.filtro) { st.agFiltro = d.filtro; pintar(false); }
    else if (d.agdia) { st.agDia = otroDiaAbierto(st.agDia, +d.agdia); pintar(false); }
    else if (d.ir) ir(d.ir);
    else if (d.accion === 'atras') { if (st.vista === 'chat') ocultarNoti(); ir(ATRAS[st.vista] || 'servicio'); }
    else if (d.accion === 'ver-chat') { ocultarNoti(); ir('chat'); }
    else if (d.accion === 'otra') { var r = st.reserva; reiniciar(); st.reserva = r; ir('servicio'); }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'f-nombre') st.nombre = e.target.value;
    if (e.target.id === 'f-tel') st.tel = e.target.value;
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = st.nombre.trim().replace(/\s+/g, ' '), tel = st.tel.replace(/[\s.-]/g, '').replace(/^(\+34|0034)/, '');
    if (nombre.length < 2) st.error = 'Escribe tu nombre para que sepamos a quién esperamos.';
    else if (!/^[67]\d{8}$/.test(tel)) st.error = 'Revisa el móvil: son 9 cifras y empieza por 6 o 7.';
    else if (!document.getElementById('f-ok').checked) st.error = 'Marca la casilla para que podamos guardar la cita y avisarte.';
    else st.error = '';
    if (st.error) { pintar(false); var el = app.querySelector('.u-error'); if (el) el.scrollIntoView({ block: 'center' }); return; }
    var min = serv(st.serv).min, quien = libreQuien(st.dia, st.barb, st.ini, min);
    if (!quien) { st.error = 'Esa hora se acaba de ocupar. Vuelve atrás y elige otra.'; pintar(false); return; }
    st.reserva = { dia: st.dia, barbero: quien, ini: st.ini, serv: st.serv, cliente: nombre.split(' ')[0], tel: tel, nueva: true, anulada: false, hecha: hhmm(ahoraMin()) };
    var h = hhmm(ahoraMin());
    st.chat = [
      { de: 'neg', txt: textoConfirmacion(st.reserva), hora: h },
      { de: 'sis', txt: st.reserva.dia === hoy() ? 'Así llegará el recordatorio, dos horas antes de la cita' : 'Así llegará el recordatorio, el día antes a las 19:00' },
      { de: 'neg', txt: textoRecordatorio(st.reserva), hora: st.reserva.dia === hoy() ? hhmm(Math.max(st.reserva.ini - 120, ahoraMin())) : '19:00' }
    ];
    st.agDia = null;
    ir('reservada');
    notiTimer = setTimeout(mostrarNoti, 1800);
  });

  /* ---------- Menú oculto: pulsación larga en el logo (o tecla M) ---------- */
  var menu = document.getElementById('menu'), logo = document.getElementById('logo'), pulsa = null, largo = false;
  function abrirMenu() { document.getElementById('menu-chat').disabled = !st.reserva; menu.classList.add('abierto'); menu.querySelector('button').focus(); }
  function cerrarMenu() { menu.classList.remove('abierto'); }
  logo.addEventListener('pointerdown', function () { largo = false; pulsa = setTimeout(function () { largo = true; abrirMenu(); }, 600); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { logo.addEventListener(ev, function () { clearTimeout(pulsa); }); });
  logo.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  logo.addEventListener('click', function (e) { if (largo) { e.preventDefault(); largo = false; return; } if (st.vista !== 'agenda') ir('servicio'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') cerrarMenu();
    if ((e.key === 'm' || e.key === 'M') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) abrirMenu();
  });
  menu.addEventListener('click', function (e) {
    if (e.target === menu) return cerrarMenu();
    var b = e.target.closest('button[data-ir]'); if (!b) return;
    var v = b.dataset.ir;
    cerrarMenu();
    if (v === 'cerrar') return;
    if (v === 'reiniciar') { reiniciar(); pintar(); return; }
    if (v === 'agenda') { st.agDia = null; st.agFiltro = 'todos'; }
    ocultarNoti();
    ir(v);
  });

  /* Enlace directo a la agenda de la barbería: #agenda */
  reiniciar();
  if (location.hash === '#agenda') st.vista = 'agenda';
  pintar();
})();
</script>
</body>
</html>
