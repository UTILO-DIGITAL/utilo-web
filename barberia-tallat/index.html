<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Barbería Tallat</title>
<!--
  Demo navegable de Utilo para visitas a barberías · T0029
  Barbería inventada, datos inventados. Nada se guarda ni se envía: todo vive en esta página.
  A la izquierda, la app del cliente dentro de un iPhone; a la derecha, el mostrador de la barbería.
  En tablet apaisada y ordenador se ven a la vez; en el móvil, una cosa cada vez.
  El chat se parece a WhatsApp en forma y uso, pero sin su logo ni sus colores.
  Menú de la demo: pulsación larga en el logo (o la tecla M).
  Orden de carga del PROTOCOLO DISEÑO UTILO: marca.css → ../estilos/base.css.
  Los estilos de abajo son solo de esta demo y usan las variables de la marca (sin HEX).
-->
<link rel="stylesheet" href="marca.css">
<link rel="stylesheet" href="../estilos/base.css">
<style>
/* Composición: en el móvil, una pantalla (app o mostrador); desde 980 px, la app dentro de un iPhone a la izquierda
   y el mostrador a la derecha. Dentro de la app: barra de navegación arriba, listas agrupadas y barra de secciones abajo. */
:root {
  --marco: color-mix(in srgb, var(--color-texto) 92%, black);
  --fondo-chat: color-mix(in srgb, var(--color-bloque) 75%, var(--color-fondo));
  --burbuja-mia: color-mix(in srgb, var(--color-accion) 13%, var(--color-superficie));
}
body.u { min-height: 100%; }
.tl-app, .tl-app * { -webkit-tap-highlight-color: transparent; }

/* ---------- Escena ---------- */
.tl-escena { min-height: 100vh; }
.tl-lado-tit { display: none; }
@media (max-width: 979px) { body[data-lado=cli] .tl-lado-neg, body[data-lado=neg] .tl-lado-cli { display: none; } }
@media (min-width: 980px) {
  .tl-escena { display: grid; grid-template-columns: 414px minmax(0, 1fr); gap: var(--e7); align-items: start;
    max-width: 1440px; margin: 0 auto; padding: var(--e5) max(var(--e5), env(safe-area-inset-right, 0px)) var(--e7) max(var(--e5), env(safe-area-inset-left, 0px)); }
  .tl-lado-cli { position: sticky; top: var(--e5); }
  .tl-lado-tit { display: block; margin: 0 0 var(--e3); font-size: 13px; color: var(--color-suave); }
}

/* ---------- El iPhone (solo en escritorio; en un móvil de verdad, la app ocupa la pantalla) ---------- */
.tl-movil { position: relative; }
.tl-pantalla { min-height: 100vh; background: var(--color-fondo); }
.tl-estado, .tl-isla, .tl-home { display: none; }
@media (min-width: 980px) {
  /* Marco, isla y barra de inicio dibujan el aparato: sus esquinas no siguen el radio de la marca */
  .tl-movil { width: 414px; height: min(860px, calc(100vh - 64px)); border: 12px solid var(--marco); border-radius: 60px;
    overflow: hidden; display: flex; flex-direction: column; background: var(--color-fondo); }
  .tl-estado { display: flex; justify-content: space-between; align-items: center; flex: none; height: 50px; padding: 4px 32px 0 40px;
    font: 600 15px/1 var(--fuente-texto); color: var(--color-texto); background: var(--color-fondo); }
  .tl-pantalla.en-chat ~ .tl-estado, .tl-movil.chat .tl-estado { background: var(--color-superficie); }
  .tl-estado svg { width: 66px; height: 13px; fill: currentColor; }
  .tl-isla { display: block; position: absolute; z-index: 90; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px;
    border-radius: 20px; background: var(--marco); }
  .tl-home { display: block; position: absolute; z-index: 90; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px;
    border-radius: 3px; background: var(--color-texto); }
  .tl-pantalla { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; }
  .tl-pantalla::-webkit-scrollbar { display: none; }
  .tl-pantalla > main { flex: 1; }
}

/* ---------- Tipografía y piezas de la app ---------- */
.tl-app { font-size: 15px; line-height: 1.4; }
.tl-app p { margin: 0; }
.tl-cli { padding: var(--e2) max(16px, env(safe-area-inset-right, 0px)) var(--e6) max(16px, env(safe-area-inset-left, 0px)); }
.u .tl-titulo { margin: var(--e2) 0 var(--e4); font: 600 26px/1.15 var(--fuente-titulos); letter-spacing: -.02em; color: var(--color-texto); }
.tl-sub { font-size: 13px; color: var(--color-suave); }
.tl-app .tl-sec { margin: var(--e5) var(--e4) var(--e2); font-size: 13px; color: var(--color-suave); }
.tl-sec-fila { display: flex; justify-content: space-between; align-items: baseline; margin: var(--e5) var(--e4) var(--e2); }
.tl-app .tl-sec-fila .tl-sec { margin: 0; }
.tl-app .tl-pie { margin: var(--e5) var(--e4) 0; font-size: 12px; color: var(--color-suave); }

/* Barra de navegación */
.tl-nav { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: env(safe-area-inset-top, 0px) var(--e2) 0; background: var(--color-fondo); }
@media (min-width: 980px) { .tl-nav { padding-top: 0; } }
.tl-nav h1 { grid-column: 2; margin: 0; font: 600 16px/1.2 var(--fuente-texto); color: var(--color-texto); }
.tl-volver { justify-self: start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 var(--e2); border: 0; background: none;
  color: var(--color-texto); font: 400 16px/1 var(--fuente-texto); cursor: pointer; }
.tl-volver svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tl-progreso { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 0 0 var(--e3); }
.tl-progreso span { height: 3px; border-radius: 2px; background: var(--color-bloque); }
.tl-progreso span.on { background: var(--color-texto); }

/* Cabecera de inicio: la marca con su punto cobalto (recurso propio) */
.tl-marca { display: flex; justify-content: space-between; align-items: center; gap: var(--e3); min-height: 44px; padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 980px) { .tl-marca { padding-top: 0; } }
.tl-logo { display: inline-flex; flex-direction: column; padding: 0; border: 0; background: none; color: var(--color-texto); text-align: left; cursor: pointer;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.tl-logo-nom { font: 700 22px/1 var(--fuente-titulos); letter-spacing: -.04em; }
.tl-punto { font-style: normal; color: var(--color-accion); }
.tl-logo-sub { font: 400 12px/1.3 var(--fuente-texto); color: var(--color-suave); }
.tl-abierto { font-size: 13px; color: var(--color-suave); text-align: right; }

/* Listas agrupadas */
.tl-grupo { margin: 0; padding: 0; list-style: none; background: var(--color-superficie); border-radius: var(--radio); overflow: hidden; }
.tl-fila { display: flex; align-items: center; gap: var(--e3); width: 100%; min-height: 48px; padding: var(--e3) var(--e4); border: 0; background: none;
  color: var(--color-texto); font: inherit; text-align: left; }
.tl-grupo > li + li > .tl-fila, .tl-grupo > .tl-fila + .tl-fila { border-top: 1px solid var(--color-linea); }
button.tl-fila, a.tl-fila { cursor: pointer; text-decoration: none; }
button.tl-fila:active, a.tl-fila:active { background: var(--color-bloque); }
.tl-fila .t { flex: 1; min-width: 0; }
.tl-fila .t small { display: block; margin-top: 1px; font-size: 13px; color: var(--color-suave); }
.tl-fila .v { flex: none; color: var(--color-suave); text-align: right; }
.tl-fila .v.fuerte { color: var(--color-texto); }
.tl-fila svg.ch { flex: none; width: 16px; height: 16px; stroke: var(--color-suave); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tl-fila svg.ic { flex: none; width: 20px; height: 20px; stroke: var(--color-texto); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tl-fila .tl-et { margin-left: var(--e2); padding: 1px 6px; border-radius: var(--radio-peq); background: var(--color-bloque); font-size: 12px; color: var(--color-texto); }
.tl-av-p { display: flex; align-items: center; justify-content: center; flex: none; width: 36px; height: 36px; border-radius: 50%;
  background: var(--color-bloque); color: var(--color-texto); font: 500 14px/1 var(--fuente-texto); }

/* Tarjeta principal de inicio */
.tl-tarjeta { display: flex; flex-direction: column; gap: var(--e3); padding: var(--e4); border-radius: var(--radio); background: var(--color-superficie); }
.tl-tarjeta .gran { font: 500 19px/1.25 var(--fuente-titulos); letter-spacing: -.01em; }
.tl-ciclo { height: 3px; border-radius: 2px; background: var(--color-bloque); }
.tl-ciclo span { display: block; height: 100%; border-radius: 2px; background: var(--color-texto); }
.tl-acciones { display: flex; flex-wrap: wrap; gap: var(--e1) var(--e4); }

/* Botones de la app: uno solo de acción, el resto sin relleno */
.tl-b { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; padding: 0 var(--e4); border: 0; border-radius: var(--radio);
  background: var(--color-accion); color: var(--color-sobre-accion); font: 500 16px/1 var(--fuente-texto); cursor: pointer; }
.tl-b2 { display: inline-flex; align-items: center; gap: var(--e2); min-height: 44px; padding: 0; border: 0; background: none;
  color: var(--color-texto); font: 500 15px/1.2 var(--fuente-texto); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; }
.tl-b3 { display: flex; align-items: center; justify-content: center; gap: var(--e2); width: 100%; min-height: 48px; border: 1px solid var(--color-borde-campo);
  border-radius: var(--radio); background: var(--color-superficie); color: var(--color-texto); font: 500 16px/1 var(--fuente-texto); cursor: pointer; }

/* Fotos del corte */
.tl-fotos { display: flex; gap: var(--e2); flex-wrap: wrap; }
.tl-fotos img, .tl-fotos video { display: block; width: 64px; height: 64px; max-width: 100%; object-fit: cover; border-radius: var(--radio-peq); background: var(--color-bloque); }
.tl-mas { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; height: 64px; border: 1px dashed var(--color-borde-campo);
  border-radius: var(--radio-peq); background: none; color: var(--color-suave); font: 400 11px/1.1 var(--fuente-texto); cursor: pointer; }
.tl-mas svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* Día y hora */
.tl-dias { display: flex; gap: var(--e2); overflow-x: auto; margin: 0 0 var(--e4); padding-bottom: 2px; scrollbar-width: none; }
.tl-dias::-webkit-scrollbar { display: none; }
.tl-dia { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px; padding: var(--e2) 0; border: 0; border-radius: var(--radio);
  background: var(--color-superficie); color: var(--color-texto); font: inherit; cursor: pointer; }
.tl-dia .dn { font-size: 12px; color: var(--color-suave); }
.tl-dia .dd { font: 500 18px/1.1 var(--fuente-texto); }
.tl-dia[aria-pressed=true] { background: var(--color-texto); color: var(--color-superficie); }
.tl-dia[aria-pressed=true] .dn { color: var(--color-superficie); }
.tl-dia:disabled { opacity: .4; cursor: default; }
.tl-horas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e2); }
.tl-hora { min-height: 44px; border: 0; border-radius: var(--radio); background: var(--color-superficie); color: var(--color-texto);
  font: 400 15px/1 var(--fuente-texto); cursor: pointer; }
.tl-hora:active { background: var(--color-texto); color: var(--color-superficie); }

/* Formularios dentro de la app */
.tl-campos .tl-fila { padding-block: var(--e1); }
.tl-campos label { width: 64px; flex: none; font-size: 15px; }
.u .tl-campos input:not([type=checkbox]) { flex: 1; min-width: 0; min-height: 44px; padding: 0; border: 0; border-radius: 0; background: none; font: 400 16px/1 var(--fuente-texto); }
.u .tl-campos input:not([type=checkbox]):focus-visible { outline: none; }
.tl-campos .tl-fila:focus-within { box-shadow: inset 2px 0 0 var(--color-texto); }
.tl-check { display: flex; gap: var(--e3); align-items: flex-start; margin: var(--e3) var(--e1); font-size: 13px; color: var(--color-suave); }
.tl-check input { margin-top: 1px; flex: none; }
.tl-app .tl-error { margin: var(--e3) var(--e1) 0; font-size: 14px; color: var(--color-error); }
.tl-o { display: flex; align-items: center; gap: var(--e3); margin: var(--e4) 0; font-size: 13px; color: var(--color-suave); }
.tl-o::before, .tl-o::after { content: ""; flex: 1; height: 1px; background: var(--color-linea); }
.tl-pegado { position: sticky; bottom: 0; margin: var(--e4) calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: var(--e3) max(16px, env(safe-area-inset-right, 0px)); background: var(--color-fondo); }

/* Cita reservada */
.tl-hecho { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-top: var(--e4); border-radius: 50%; background: var(--color-texto); }
.tl-hecho svg { width: 22px; height: 22px; stroke: var(--color-superficie); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* Barra de secciones de la app */
.tl-tabs { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 4px env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: var(--color-superficie); border-top: 1px solid var(--color-linea); }
.tl-tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; border: 0; background: none;
  color: var(--color-suave); font: 500 11px/1.2 var(--fuente-texto); cursor: pointer; }
.tl-tabs button[aria-current=page] { color: var(--color-texto); }
.tl-tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tl-tabs[hidden] { display: none; }
body[data-lado=cli] .tl-pantalla { padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 980px) {
  .tl-tabs { position: sticky; flex: none; padding: 4px 0 22px; }
  body[data-lado] .tl-pantalla { padding-bottom: 0; }
}

/* Aviso que llega al móvil, como el de iOS (flota: lleva la sombra) */
.tl-noti { position: fixed; z-index: 80; top: calc(var(--e2) + env(safe-area-inset-top, 0px));
  left: calc(var(--e2) + env(safe-area-inset-left, 0px)); right: calc(var(--e2) + env(safe-area-inset-right, 0px));
  max-width: 420px; margin: 0 auto; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 0 var(--e3); align-items: center;
  padding: var(--e3) var(--e4) var(--e3) var(--e3); border: 0; border-radius: 22px; background: var(--color-superficie);
  color: var(--color-texto); box-shadow: var(--sombra-flota); font: inherit; text-align: left; cursor: pointer;
  transform: translateY(calc(-100% - 24px)); transition: transform 200ms ease-out; }
.tl-noti.on { transform: none; }
.tl-noti[hidden] { display: none; }
@media (min-width: 980px) { .tl-noti { position: absolute; top: 56px; left: 10px; right: 10px; } }
.tl-noti .app { grid-row: 1 / span 2; width: 38px; height: 38px; border-radius: 9px; }
.tl-noti .tit { display: flex; justify-content: space-between; gap: var(--e2); font-size: 14px; font-weight: 600; }
.tl-noti .tit span { font-weight: 400; font-size: 13px; color: var(--color-suave); }
.tl-noti .txt { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-av { display: flex; align-items: center; justify-content: center; flex: none; width: 36px; height: 36px; border-radius: 50%;
  background: var(--color-texto); color: var(--color-superficie); font: 600 16px/1 var(--fuente-titulos); }

/* ---------- Chat: la forma de WhatsApp (burbujas con pico, marcas de leído, botones bajo el mensaje), sin su marca ---------- */
.tl-pantalla.en-chat { background: var(--fondo-chat); }
.tl-chat { min-height: 100%; display: flex; flex-direction: column; background: var(--fondo-chat); }
@media (max-width: 979px) { .tl-chat { min-height: 100vh; min-height: 100dvh; } }
.tl-chat-cab { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--e2);
  padding: calc(var(--e1) + env(safe-area-inset-top, 0px)) var(--e3) var(--e1) var(--e1); background: var(--color-superficie); border-bottom: 1px solid var(--color-linea); }
@media (min-width: 980px) { .tl-chat-cab { padding-top: var(--e1); } }
.tl-chat-cab .q { flex: 1; min-width: 0; }
.tl-chat-cab strong { display: block; font-size: 16px; font-weight: 500; }
.tl-chat-cab .q span { font-size: 12px; color: var(--color-suave); }
.tl-msgs { flex: 1; display: flex; flex-direction: column; gap: 3px; padding: var(--e3) var(--e3) var(--e4); }
.tl-fecha-chat { align-self: center; margin: var(--e2) 0; padding: 3px 10px; border-radius: 8px; background: var(--color-superficie); font-size: 12px; color: var(--color-suave); }
.tl-sis { align-self: center; max-width: 88%; margin: var(--e3) 0 var(--e2); padding: 4px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--color-superficie) 70%, transparent); color: var(--color-suave); font-size: 12px; text-align: center; }
.tl-msg { position: relative; max-width: 82%; padding: 6px 8px 5px 9px; border-radius: 8px; font-size: 15px; line-height: 1.35; white-space: pre-line; overflow-wrap: anywhere; }
.tl-msg.neg { align-self: flex-start; margin-left: 8px; background: var(--color-superficie); border-top-left-radius: 0; }
.tl-msg.cli { align-self: flex-end; margin-right: 8px; background: var(--burbuja-mia); border-top-right-radius: 0; }
.tl-msg.neg::before, .tl-msg.cli::before { content: ""; position: absolute; top: 0; width: 0; height: 0; border-top: 9px solid var(--color-superficie); }
.tl-msg.neg::before { left: -8px; border-left: 8px solid transparent; }
.tl-msg.cli::before { right: -8px; border-right: 8px solid transparent; border-top-color: var(--burbuja-mia); }
.tl-msg .meta { float: right; display: inline-flex; align-items: center; gap: 3px; margin: 6px 0 -4px 10px; font-size: 11px; line-height: 1;
  color: var(--color-suave); white-space: nowrap; }
.tl-msg .meta svg { width: 16px; height: 11px; stroke: var(--color-accion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tl-msg img, .tl-msg video { display: block; width: 200px; max-width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin: -2px -4px 4px -5px; }
.tl-msg.entra { animation: tl-entra 180ms ease-out; }
@keyframes tl-entra { from { opacity: 0; transform: translateY(4px); } }
.tl-msg .neg-tit { display: block; margin-bottom: 2px; font-size: 13px; font-weight: 500; color: var(--color-accion); }
/* Botones de respuesta rápida, pegados debajo del mensaje */
.tl-wbtns { align-self: flex-start; display: grid; gap: 3px; width: min(82%, 300px); margin: 0 0 var(--e2) 8px; }
.tl-wbtns button { display: flex; align-items: center; justify-content: center; gap: var(--e2); min-height: 40px; border: 0; border-radius: 8px;
  background: var(--color-superficie); color: var(--color-accion); font: 500 15px/1.2 var(--fuente-texto); cursor: pointer; }
.tl-wbtns button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tl-wbtns button:disabled { color: var(--color-suave); cursor: default; }
.tl-redactar { position: sticky; bottom: 0; display: flex; align-items: center; gap: var(--e2); padding: var(--e2) var(--e2) calc(var(--e2) + env(safe-area-inset-bottom, 0px));
  background: var(--fondo-chat); }
.tl-redactar span { flex: 1; min-height: 42px; display: flex; align-items: center; padding: 0 var(--e4); border-radius: 21px; background: var(--color-superficie);
  font-size: 15px; color: var(--color-suave); }
.tl-redactar i { display: flex; align-items: center; justify-content: center; flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--color-texto); }
.tl-redactar i svg { width: 20px; height: 20px; stroke: var(--color-superficie); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (min-width: 980px) { .tl-redactar { padding-bottom: 26px; } }

/* ---------- El mostrador de la barbería ---------- */
.tl-neg { padding: var(--e4) max(16px, env(safe-area-inset-right, 0px)) var(--e7) max(16px, env(safe-area-inset-left, 0px)); font-size: 15px; }
@media (min-width: 980px) { .tl-neg { padding: 0; } }
.tl-ncab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e3); padding-bottom: var(--e3); border-bottom: 1px solid var(--color-linea); }

    var k = st.agDia, citas = citasDe(k), total = citas.reduce(function (a, c) { return a + serv(c.serv).eur; }, 0), oc = ocupacion(k);

        var s = serv(c.serv), cls = 'tl-blq' + (s.min * PPM < 40 ? ' corto' : '') + (c.mia ? ' mia' : '') + (pasada(c.dia, c.ini + s.min - 16) ? ' pasada' : '') + (st.flash === c.id ? ' flash' : '');
        var etiqueta = c.mia ? (c.estado === 'confirmada' ? 'Confirmada' : 'Nueva, desde la app') : s.corto;
        return '<button type="button" class="' + cls + '" data-cita="' + c.id + '" style="top:' + ((c.ini - ABRE) * PPM + 1) + 'px;height:' + (s.min * PPM - 2) + 'px">' +
          '<span class="c">' + esc(c.cliente) + '</span><span class="s"><span class="hh">' + hhmm(c.ini) + ' · </span>' + etiqueta + '</span></button>';

    }).join('');
    var cols3 = 'grid-template-columns: 44px repeat(' + BARB.length + ', minmax(0, 1fr))';   // una columna por barbero

    return '<div class="tl-ncab"><button type="button" class="tl-logo" data-logo aria-label="' + esc(A.negocio) + '. Pulsación larga: menú de la demo">' +
      '<span class="tl-logo-nom">' + esc(A.logo) + '<i class="tl-punto">.</i></span><span class="tl-logo-sub">Mostrador</span></button>' +
      '<div class="tl-ndia"><button type="button" class="u-btn u-btn-icono" data-agdia="-1" aria-label="Día anterior">' + ICO.ant + '</button>' +
      '<h1>' + titulo + '</h1><button type="button" class="u-btn u-btn-icono" data-agdia="1" aria-label="Día siguiente">' + ICO.sig + '</button></div></div>' +
      '<div class="tl-kpis">' +
      '<div class="tl-kpi"><span class="l">Citas</span><span class="v">' + citas.length + '</span></div>' +
      '<div class="tl-kpi"><span class="l">Ocupación</span><span class="v">' + oc + ' %</span><span class="barra"><span style="width:' + oc + '%"></span></span></div>' +
      '<div class="tl-kpi"><span class="l">Previsto</span><span class="v cifra">' + eur(total) + '</span></div>' +
      '<div class="tl-kpi"><span class="l">Huecos libres</span><span class="v">' + huecos(k) + '</span></div></div>' +
      '<p class="tl-mes"><span>Este mes (ejemplo):</span>' + dato('web', 'reservas sin llamar') + dato('avisos', 'WhatsApp enviados') +
      dato('ausencias', 'ausencias evitadas') + dato('resenas', 'reseñas pedidas') + '</p>' +
      '<div class="tl-cuad-cab" style="' + cols3 + '"><span></span>' + BARB.map(function (b) {
        return '<div><strong>' + b.id + '</strong><span>' + citas.filter(function (c) { return c.barbero === b.id; }).length + ' citas</span></div>';
      }).join('') + '</div>' +
      '<div class="tl-cuad" style="' + cols3 + '"><div class="tl-eje" style="height:' + alto + 'px">' + eje + '</div>' + cols + ahora + '</div>' +
      '<p class="tl-leyenda"><span><i></i>Cita de ejemplo</span><span><i class="mia"></i>Reservada en la demo</span>' +
      (hayAhora ? '<span><i class="ahora"></i>Ahora</span>' : '') + '<span>Toca una cita para ver la ficha del cliente</span></p>';
  }

  /* ---------- Ventanas: ficha del cliente y entrar con Google ---------- */
  var fichaEl = document.getElementById('ficha'), fichaIn = document.getElementById('ficha-in');
  function abrirVentana(html, foco) {
    fichaIn.innerHTML = html;
    fichaEl.classList.add('abierto');
    var f = fichaIn.querySelector(foco || '[data-cerrar]'); if (f) f.focus();
  }
  function cerrarVentana() { fichaEl.classList.remove('abierto'); }
  function abrirFicha(id) {
    var c = buscarCita(id); if (!c) return;
    var s = serv(c.serv), html;
    if (c.mia) {
      var hist = st.historial.filter(function (h) { return h.id !== c.id; }), conFotos = st.historial.filter(function (h) { return h.fotos.length; })[0];
      var filas = hist.slice(0, 3).map(function (h) { var sv = serv(h.serv); return '<tr><td>' + ddmmaaaa(h.dia) + '</td><td>' + sv.nom + ' · ' + esc(h.barbero) + '</td><td class="num">' + eur(sv.eur) + '</td></tr>'; }).join('');
      html = '<p class="tl-sub">Ficha del cliente</p><h2 id="ficha-tit">' + esc(c.cliente) + '</h2>' +
        (hist.length ? '<p class="vueltas"><b>' + hist.length + ' visitas</b>, casi siempre con ' + (barberoHabitual() || c.barbero) + '</p>' : '<p class="vueltas">Cliente nuevo</p>') +
        '<dl><dt>Cita</dt><dd>' + diaCorto(c.dia) + ', ' + hhmm(c.ini) + '</dd><dt>Servicio</dt><dd>' + s.nom + ' con ' + c.barbero + ' · ' + eur(s.eur) + '</dd>' +
        '<dt>Reservó</dt><dd>' + (c.origen === 'whatsapp' ? 'Contestando al WhatsApp de «ya te toca»' : 'Desde la app a las ' + c.hecha) + ', sin llamar</dd>' +
        '<dt>Estado</dt><dd>' + (c.estado === 'confirmada' ? 'Confirmada por WhatsApp' : 'Pendiente de confirmar') + '</dd><dt>Móvil</dt><dd>' + mascara(c.tel) + '</dd>' +
        (hist[0] && hist[0].nota ? '<dt>Quiere</dt><dd>«' + esc(hist[0].nota) + '»</dd>' : '') + '</dl>' +
        (conFotos ? '<p class="tl-sub">Fotos de su corte del ' + ddmm(conFotos.dia) + '</p>' + fotos(conFotos, true) : '') +
        (filas ? '<table><thead><tr><th>Visitas</th><th>Servicio</th><th class="num">Importe</th></tr></thead><tbody>' + filas + '</tbody></table>' : '');
    } else {
      var r = azar(hash(c.cliente + c.barbero)), visitas = 2 + Math.floor(r() * 14), cada = 3 + Math.floor(r() * 4), f2 = '', gasto = 0;
      for (var i = 1; i <= 3; i++) {
        var k = sumarDias(c.dia, -7 * cada * i), sv = i === 1 ? s : SERV[Math.floor(r() * Math.min(2, SERV.length))];
        f2 += '<tr><td>' + ddmmaaaa(k) + '</td><td>' + sv.nom + '</td><td class="num">' + eur(sv.eur) + '</td></tr>';
      }
      for (var j = 0; j < visitas; j++) gasto += j % 3 === 2 ? 22 : 16;
      html = '<p class="tl-sub">Ficha del cliente</p><h2 id="ficha-tit">' + esc(c.cliente) + '</h2>' +
        '<p class="vueltas"><b>' + visitas + ' visitas</b>, viene cada ' + cada + ' semanas, casi siempre con ' + c.barbero + '</p>' +
        '<dl><dt>Cita</dt><dd>' + cuando(c.dia) + ', ' + hhmm(c.ini) + ' · ' + s.nom + '</dd><dt>Gastado</dt><dd>' + eur(gasto) + ' en total</dd>' +
        '<dt>Avisos</dt><dd>Recordatorio enviado y confirmado</dd></dl>' +
        '<table><thead><tr><th>Últimas visitas</th><th>Servicio</th><th class="num">Importe</th></tr></thead><tbody>' + f2 + '</tbody></table>';
    }
    abrirVentana(html + '<p class="tl-sub">Datos de ejemplo.</p><button type="button" class="u-btn" data-cerrar>Cerrar la ficha</button>');
  }
  /* Entrar con Google, simulado: sin logos de Google y sin pedir contraseña */
  function abrirGoogle() {
    abrirVentana('<p class="tl-sub">Simulación</p><h2 id="ficha-tit">Entrar con Google</h2>' +
      '<p>En la app de verdad se abre la ventana de Google, eliges tu cuenta y listo: la app recibe tu nombre y tu correo, nunca tu contraseña.</p>' +
      '<form id="f-google" novalidate style="display:flex;flex-direction:column;gap:var(--e3)"><label class="u-campo" for="g-nombre"><span class="tl-sub">Nombre de tu cuenta</span>' +
      '<input id="g-nombre" autocomplete="given-name" placeholder="Cómo te llamas"></label>' +
      '<p class="tl-error" id="g-error" role="alert" hidden>Escribe tu nombre para entrar.</p>' +
      '<button type="submit" class="tl-b">Entrar</button></form>' +
      '<button type="button" class="u-btn u-btn-texto" data-cerrar>Ahora no</button>', '#g-nombre');
  }
  fichaEl.addEventListener('click', function (e) { if (e.target === fichaEl || e.target.closest('[data-cerrar]')) cerrarVentana(); });
  fichaEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var n = document.getElementById('g-nombre').value.trim().replace(/\s+/g, ' ');
    if (n.length < 2) { document.getElementById('g-error').hidden = false; return; }
    st.usuario = { nombre: n.split(' ')[0], tel: '', google: true, ok: false };
    cerrarVentana(); pintar(false);
  });

  /* ---------- Pintar ---------- */
  var VISTAS = { inicio: vInicio, servicio: vServicio, barbero: vBarbero, hora: vHora, confirmar: vConfirmar, reservada: vReservada, cortes: vCortes, perfil: vPerfil, chat: vChat };
  var TAB = { inicio: 'inicio', servicio: 'reservar', barbero: 'reservar', hora: 'reservar', confirmar: 'reservar', reservada: 'reservar', cortes: 'cortes', perfil: 'perfil' };
  var ATRAS = { servicio: 'inicio', barbero: 'servicio', hora: 'barbero', confirmar: 'hora', chat: 'reservada' };
  /* Al volver atrás se borra lo que se eligió en el paso al que se vuelve: no se queda nada marcado */
  var DESHACER = { barbero: function () { st.serv = null; }, hora: function () { st.barb = null; st.dia = null; st.ini = null; }, confirmar: function () { st.ini = null; st.error = ''; } };

  function escritorio() { return window.matchMedia('(min-width: 980px)').matches; }
  function pintarCli(arriba) {
    var esChat = st.vista === 'chat' && st.actual;
    tabs.hidden = !!esChat;
    movil.classList.toggle('chat', !!esChat);
    cliEl.className = esChat ? '' : 'tl-cli';
    pantalla.classList.toggle('en-chat', !!esChat);
    cliEl.innerHTML = VISTAS[st.vista]();
    tabs.querySelectorAll('button').forEach(function (b) { if (b.dataset.tab === TAB[st.vista]) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    st.chat.forEach(function (m) { m.nuevo = false; });
    if (esChat) { var m = document.getElementById('msgs'); if (m && m.lastElementChild) m.lastElementChild.scrollIntoView({ block: 'end' }); }
    else if (arriba !== false) { pantalla.scrollTop = 0; if (!escritorio()) window.scrollTo(0, 0); }
  }
  function pintarNeg() { negEl.innerHTML = vNegocio(); }
  function pintar(arriba) {
    document.body.dataset.lado = st.lado;
    document.getElementById('reloj').textContent = hhmm(ahoraMin());
    pintarCli(arriba); pintarNeg();
  }
  function ir(v) { st.error = ''; st.vista = v; st.lado = 'cli'; pintar(); }
  function empezarReserva(sv, b) { st.serv = sv || null; st.barb = b || null; st.dia = null; st.ini = null; ir(sv && b ? 'hora' : sv ? 'barbero' : 'servicio'); }
  function irNeg() {
    st.lado = 'neg'; pintar();
    if (escritorio()) negEl.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
  }
  function mostrarFlash() {
    if (!st.flash) return;
    var el = negEl.querySelector('[data-cita="' + st.flash + '"]');
    if (el && (escritorio() || st.lado === 'neg')) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    st.flash = null;
  }

  /* ---------- Aviso del mostrador ---------- */
  var toast = document.getElementById('toast'), tToast = null;
  function avisoMostrador(tit, txt) {
    if (!escritorio() && st.lado !== 'neg') return;   // en el móvil solo sale si se está mirando el mostrador
    toast.innerHTML = '<strong>' + tit + '</strong><span>' + esc(txt) + '</span>';
    toast.hidden = false; clearTimeout(tToast);
    tToast = setTimeout(function () { toast.hidden = true; }, 5000);
  }

  /* ---------- Aviso en el móvil y chat ---------- */
  var noti = document.getElementById('noti'), notiTimer = null;
  function textoConfirmacion(r) { return texto(r.cambio ? 'cambiada' : 'confirmacion', huecosDe(r)); }
  function mostrarNoti() {
    if (!st.actual) return;
    document.getElementById('noti-txt').textContent = textoConfirmacion(cita(st.actual)).replace(/\n+/g, ' · ');
    noti.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { noti.classList.add('on'); }); });
  }
  function ocultarNoti() { clearTimeout(notiTimer); noti.classList.remove('on'); noti.hidden = true; }
  noti.addEventListener('click', function () { ocultarNoti(); ir('chat'); });

  function msg(de, txt, hora, botones, media) { st.chat.push({ de: de, txt: txt, hora: hora || hhmm(ahoraMin()), botones: botones, media: media, nuevo: true }); }
  function sumarMes(c, n) { st.mes[c] += n || 1; st.cambioMes = c; }
  function nuevaCita(k, barbero, ini, sv, cliente, tel, origen) {
    var c = { id: k + '-m' + (st.mias.length + 1), dia: k, barbero: barbero, ini: ini, serv: sv, cliente: cliente, tel: tel,
      mia: true, estado: 'pendiente', origen: origen, hecha: hhmm(ahoraMin()) };
    st.mias.push(c);
    return c;
  }
  function anular(r, motivo) {
    r.estado = 'anulada'; st.agDia = r.dia;
    if (motivo === 'anular') { sumarMes('ausencias'); avisoMostrador('Ausencia evitada', r.cliente + ' ha anulado: las ' + hhmm(r.ini) + ' con ' + r.barbero + ' vuelven a estar libres.'); }
  }

  /* Respuestas a los botones del chat */
  function responder(i, rsp) {
    var m = st.chat[i], r = cita(st.actual), s = serv(r.serv);
    if (m) m.usado = true;
    var etiqueta = m && m.botones.filter(function (b) { return b.r === rsp; })[0];
    if (rsp === 'foto') { pedirFoto(corteDeCita(r).id, true); return; }
    if (rsp === 'resena') { msg('sis', 'Aquí se abriría vuestra ficha de Google para dejar la reseña'); pintar(false); return; }
    if (rsp === 'otra') { st.cambiando = r.id; empezarReserva(r.serv, r.barbero); return; }
    msg('cli', etiqueta ? etiqueta.txt : rsp);
    if (rsp === 'si') {
      r.estado = 'confirmada';
      msg('neg', texto('confirmada', huecosDe(r)));
      st.agDia = r.dia; st.flash = r.id;
      avisoMostrador('Confirmada', r.cliente + ' ha confirmado su cita de las ' + hhmm(r.ini) + ' con ' + r.barbero + '.');
      /* Lo que llega después del corte: la foto, la reseña y, a las 4 semanas, «ya te toca» */
      tPost1 = setTimeout(function () {
        msg('sis', 'Una hora después del corte');
        msg('neg', texto('pedirFoto', huecosDe(r)), hhmm(Math.min(r.ini + s.min + 60, 1439)), [{ txt: A.mensajes.botonFoto, r: 'foto', foto: true }]);
        msg('neg', texto('pedirResena', huecosDe(r)), hhmm(Math.min(r.ini + s.min + 61, 1439)), [{ txt: A.mensajes.botonResena, r: 'resena' }]);
        sumarMes('avisos'); sumarMes('resenas'); pintar(false);
      }, 1200);
      tPost2 = setTimeout(function () {
        var vuelta = sumarDias(r.dia, CICLO);
        msg('sis', (+C.cadaSemanas || 4) + ' semanas después');
        msg('neg', texto('yaTeToca', huecosDe(r, { diaSemana: DIA_L[fecha(vuelta).getDay()], diaMes: fecha(vuelta).getDate() })),
          '11:00', [{ txt: A.mensajes.botonesYaTeToca[0], r: 'guardar' }, { txt: A.mensajes.botonesYaTeToca[1], r: 'otro' }]);
        sumarMes('avisos'); pintar(false);
      }, 2600);
    } else if (rsp === 'cambiar') {
      msg('neg', texto('cambiar', huecosDe(r)), null, [{ txt: 'Elegir otra hora', r: 'otra' }]);
    } else if (rsp === 'anular') {
      anular(r, 'anular');
      msg('neg', texto('anulada', huecosDe(r)));
    } else if (rsp === 'guardar') {
      /* La misma hora y el mismo barbero si están libres; si no, la hora más cercana con él o con otro */
      var k = sumarDias(r.dia, CICLO), hueco = horaCercana(k, r.barbero, r.ini, s.min) || horaCercana(k, '*', r.ini, s.min);
      if (hueco) {
        var quien = libreQuien(k, hueco.b, hueco.t, s.min), n = nuevaCita(k, quien, hueco.t, r.serv, r.cliente, r.tel, 'whatsapp');
        n.estado = 'confirmada';
        msg('neg', texto('vuelta', huecosDe(n, { dia: diaCorto(k).toLowerCase() })) +
          (hueco.t !== r.ini || quien !== r.barbero ? ' A las ' + hhmm(r.ini) + ' ya estaba cogido.' : ''));
        st.agDia = k; st.flash = n.id; sumarMes('web');
        avisoMostrador('Vuelve', r.cliente + ' repite el ' + cuando(k) + ' a las ' + hhmm(hueco.t) + ' con ' + quien + '. Sin llamadas.');
      } else msg('neg', 'Ese día ya está lleno. Elige otro y te lo guardamos.', null, [{ txt: 'Elegir día y hora', r: 'otra' }]);
    } else if (rsp === 'otro') {
      msg('neg', texto('otroDia', huecosDe(r)), null, [{ txt: 'Elegir día y hora', r: 'otra' }]);
    }
    pintar(false); mostrarFlash();
  }

  /* ---------- Fotos y vídeos del corte ---------- */
  var inputFoto = document.getElementById('f-foto');
  function pedirFoto(id, desdeChat) { st.fotoPara = { id: id, chat: desdeChat }; inputFoto.value = ''; inputFoto.click(); }
  inputFoto.addEventListener('change', function () {
    var p = st.fotoPara, h = p && st.historial.filter(function (x) { return x.id === p.id; })[0];
    if (!h || !inputFoto.files.length) return;
    var nuevas = Array.prototype.map.call(inputFoto.files, function (f) { return { url: URL.createObjectURL(f), video: /^video\//.test(f.type) }; });
    h.fotos = h.fotos.concat(nuevas);
    if (p.chat) {
      /* La foto va justo después de la petición de foto, no al final del chat */
      var i = st.chat.findIndex(function (m) { return m.botones && m.botones[0].r === 'foto'; });
      var hora = i >= 0 ? st.chat[i].hora : hhmm(ahoraMin());
      var nuevos = [{ de: 'cli', txt: nuevas.length > 1 ? nuevas.length + ' archivos' : '', hora: hora, media: nuevas[0], nuevo: true },
        { de: 'neg', txt: texto('fotoGuardada', { barbero: h.barbero }), hora: hora, nuevo: true }];
      if (i >= 0) st.chat.splice.apply(st.chat, [i + 1, 0].concat(nuevos)); else st.chat = st.chat.concat(nuevos);
      var r = cita(h.id); if (r) r.hechaYa = true;   // en la demo, mandar la foto equivale a haber ido ya
    }
    avisoMostrador('Fotos', (st.usuario ? st.usuario.nombre : 'El cliente') + ' ha añadido ' + (nuevas.length > 1 ? nuevas.length + ' fotos' : 'una foto') + ' a su corte con ' + h.barbero + '.');
    pintar(false);
  });
  function corteDeCita(r) {
    var h = st.historial.filter(function (x) { return x.id === r.id; })[0];
    if (!h) { h = { id: r.id, dia: r.dia, barbero: r.barbero, serv: r.serv, ini: r.ini, nota: '', fotos: [] }; st.historial.unshift(h); }
    return h;
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.closest('#menu') || b.closest('#ficha') || b.hasAttribute('data-logo') || b.id === 'noti') return;
    var d = b.dataset;
    if (d.tab) { ocultarNoti(); if (d.tab === 'reservar') { st.cambiando = null; empezarReserva(); } else ir(d.tab); }
    else if (d.serv) empezarReserva(d.serv);
    else if (d.barb) { st.barb = d.barb; st.dia = null; st.ini = null; ir('hora'); }
    else if (d.dia) { st.dia = d.dia; st.ini = null; pintarCli(false); }
    else if (d.hora) { st.ini = +d.hora; ir('confirmar'); }
    else if (d.repetir) { var h = st.historial.filter(function (x) { return x.id === d.repetir; })[0]; st.cambiando = null; empezarReserva(h.serv, h.barbero); }
    else if (d.foto) pedirFoto(d.foto, false);
    else if (d.ics) bajarIcs(cita(d.ics));
    else if (d.cambiar) { var c = cita(d.cambiar); st.cambiando = c.id; empezarReserva(c.serv, c.barbero); }
    else if (d.anular) { anular(cita(d.anular), 'anular'); pintar(false); }
    else if (d.r) responder(+d.msg, d.r);
    else if (d.agdia) { st.agDia = otroDiaAbierto(st.agDia, +d.agdia); st.cambioMes = null; pintarNeg(); }
    else if (d.cita) abrirFicha(d.cita);
    else if (d.accion === 'atras') {
      if (st.vista === 'chat') ocultarNoti();
      var a = ATRAS[st.vista] || 'inicio';
      if (DESHACER[st.vista]) DESHACER[st.vista]();
      ir(a);
    }
    else if (d.accion === 'google') abrirGoogle();
    else if (d.accion === 'salir') { st.usuario = null; st.historial = []; ir('inicio'); }
    else if (d.accion === 'ver-chat') { ocultarNoti(); ir('chat'); }
  });
  cliEl.addEventListener('input', function (e) {
    if (e.target.id === 'f-nombre') st.nombre = e.target.value;
    if (e.target.id === 'f-tel') st.tel = e.target.value;
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'f-datos') return;
    e.preventDefault();
    var u = st.usuario, nombre = u ? u.nombre : st.nombre.trim().replace(/\s+/g, ' ');
    var tel = u && u.tel ? u.tel : st.tel.replace(/[\s.-]/g, '').replace(/^(\+34|0034)/, '');
    var ok = document.getElementById('f-ok');
    if (nombre.length < 2) st.error = 'Escribe tu nombre para que sepamos a quién esperamos.';
    else if (!/^[67]\d{8}$/.test(tel)) st.error = 'Revisa el móvil: son 9 cifras y empieza por 6 o 7.';
    else if (ok && !ok.checked) st.error = 'Marca la casilla para que podamos guardar la cita y avisarte.';
    else st.error = '';
    if (st.error) { pintarCli(false); var el = cliEl.querySelector('.tl-error'); if (el) el.scrollIntoView({ block: 'center' }); return; }
    var min = serv(st.serv).min, quien = libreQuien(st.dia, st.barb, st.ini, min);
    if (!quien) { st.error = 'Esa hora se acaba de ocupar. Vuelve atrás y elige otra.'; pintarCli(false); return; }
    if (u) { u.tel = tel; u.ok = true; } else st.usuario = { nombre: nombre.split(' ')[0], tel: tel, google: false, ok: true };
    clearTimeout(tPost1); clearTimeout(tPost2);
    var vieja = st.cambiando && cita(st.cambiando);
    if (vieja) anular(vieja, 'cambio');
    var r = nuevaCita(st.dia, quien, st.ini, st.serv, st.usuario.nombre, tel, 'web');
    r.cambio = !!vieja; st.cambiando = null;
    st.actual = r.id;
    st.chat = [];
    msg('neg', textoConfirmacion(r));
    msg('sis', r.dia === hoy() ? 'Dos horas antes de la cita' : 'El día antes, a las 19:00');
    msg('neg', texto('recordatorio', huecosDe(r)),
      r.dia === hoy() ? hhmm(Math.max(r.ini - 120, ahoraMin())) : '19:00',
      [{ txt: A.mensajes.botonesRecordatorio[0], r: 'si' }, { txt: A.mensajes.botonesRecordatorio[1], r: 'cambiar' }, { txt: A.mensajes.botonesRecordatorio[2], r: 'anular' }]);
    st.agDia = r.dia; st.flash = r.id;
    sumarMes('avisos', 2); if (!vieja) sumarMes('web');
    ir('reservada');
    mostrarFlash();
    avisoMostrador(vieja ? 'Cita cambiada' : 'Nueva cita', r.cliente + ', ' + cuando(r.dia) + ' a las ' + hhmm(r.ini) + ' con ' + quien + (vieja ? ' (antes ' + cuando(vieja.dia) + ' a las ' + hhmm(vieja.ini) + ').' : '. WhatsApp enviado.'));
    notiTimer = setTimeout(mostrarNoti, 1800);
  });

  /* ---------- Menú oculto: pulsación larga en un logo (o tecla M) ---------- */
  var menu = document.getElementById('menu'), pulsa = null, largo = false;
  function abrirMenu() { document.getElementById('menu-chat').disabled = !st.actual; menu.classList.add('abierto'); menu.querySelector('button').focus(); }
  function cerrarMenu() { menu.classList.remove('abierto'); }
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('[data-logo]')) return;
    largo = false; pulsa = setTimeout(function () { largo = true; abrirMenu(); }, 600);
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) { document.addEventListener(ev, function () { clearTimeout(pulsa); }); });
  document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-logo]')) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    var l = e.target.closest('[data-logo]'); if (!l) return;
    if (largo) { largo = false; return; }
    if (l.closest('#cli')) { st.cambiando = null; ir('inicio'); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { cerrarMenu(); cerrarVentana(); }
    if ((e.key === 'm' || e.key === 'M') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) abrirMenu();
  });
  menu.addEventListener('click', function (e) {
    if (e.target === menu) return cerrarMenu();
    var b = e.target.closest('button[data-ir]'); if (!b) return;
    var v = b.dataset.ir;
    cerrarMenu();
    if (v === 'cerrar') return;
    if (v === 'habitual' || v === 'nuevo') { reiniciar(v === 'nuevo'); pintar(); return; }
    if (v === 'neg') { irNeg(); return; }
    ocultarNoti();
    ir(v);
  });

  /* El reloj del móvil y la línea de «ahora» se mueven solos */
  setInterval(function () { document.getElementById('reloj').textContent = hhmm(ahoraMin()); if (!fichaEl.classList.contains('abierto')) pintarNeg(); }, 60000);

  /* Enlace directo al mostrador: #mostrador */
  document.title = A.negocio;
  document.getElementById('noti-neg').textContent = A.negocio;
  reiniciar(false);
  if (location.hash === '#mostrador') st.lado = 'neg';
  pintar();
})();
</script>
</body>
</html>
