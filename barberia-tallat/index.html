<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Barbería Tallat</title>
<!--
  Demo navegable de Utilo para visitas a barberías · T0029
  Barbería inventada, datos inventados. Nada se guarda ni se envía: todo vive en esta página.
  A la izquierda, la app del cliente (inicio, reservar, mis cortes con fotos, perfil); a la derecha, el mostrador de la barbería.
  En tablet apaisada y ordenador se ven a la vez; en el móvil, una cosa cada vez.
  Menú de la demo: pulsación larga en el logo (o la tecla M).
  Orden de carga del PROTOCOLO DISEÑO UTILO: marca.css → ../estilos/base.css.
  Los estilos de abajo son solo de esta demo y usan las variables de la marca (sin HEX).
-->
<link rel="stylesheet" href="marca.css">
<link rel="stylesheet" href="../estilos/base.css">
<style>
/* Composición: en el móvil, una pantalla (app del cliente o mostrador); desde 980 px, la app dentro de un teléfono
   a la izquierda y el mostrador de la barbería a la derecha, para ver entrar la cita en directo. */

/* Color del marco del teléfono en escritorio, derivado de la tinta */
:root { --marco: color-mix(in srgb, var(--color-texto) 92%, black); }
body.u { min-height: 100%; }

/* ---------- Escena ---------- */
.tl-escena { min-height: 100vh; }
.tl-lado-tit { display: none; }
@media (max-width: 979px) {
  body[data-lado=cli] .tl-lado-neg, body[data-lado=neg] .tl-lado-cli { display: none; }
}
@media (min-width: 980px) {
  .tl-escena { display: grid; grid-template-columns: 392px minmax(0, 1fr); gap: var(--e7); align-items: start;
    max-width: 1440px; margin: 0 auto; padding: var(--e5) max(var(--e5), env(safe-area-inset-right, 0px)) var(--e7) max(var(--e5), env(safe-area-inset-left, 0px)); }
  .tl-lado-cli { position: sticky; top: var(--e5); }
  .tl-lado-tit { display: block; margin: 0 0 var(--e3); }
}

/* ---------- La app del cliente ---------- */
.tl-movil { position: relative; }
.tl-pantalla { min-height: 100vh; background: var(--color-fondo); }
.tl-estado { display: none; }
@media (min-width: 980px) {
  /* Marco del teléfono: excepción al radio único, porque dibuja el aparato y no es un componente */
  .tl-movil { width: 392px; height: min(812px, calc(100vh - 80px)); border: 10px solid var(--marco); border-radius: 44px;
    outline: 1px solid var(--color-linea); overflow: hidden; display: flex; flex-direction: column; background: var(--color-fondo); }
  .tl-estado { display: flex; justify-content: space-between; align-items: center; flex: none; height: 32px; padding: 0 var(--e5);
    font: 700 13px/1 var(--fuente-texto); font-variant-numeric: tabular-nums; color: var(--color-texto); background: var(--color-fondo); }
  .tl-estado svg { width: 34px; height: 12px; fill: currentColor; }
  .tl-pantalla { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; }
  .tl-pantalla::-webkit-scrollbar { display: none; }
  .tl-pantalla > main { flex: 1; }
}

/* Cabecera: la marca en minúsculas con su punto cobalto (recurso propio) y una línea fina */
.tl-cab { padding-top: env(safe-area-inset-top, 0px); background: var(--color-fondo); border-bottom: 1px solid var(--color-linea); }
.tl-cab-in { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--e3);
  padding: var(--e4) max(16px, env(safe-area-inset-right, 0px)) var(--e3) max(16px, env(safe-area-inset-left, 0px)); }
.tl-logo { display: flex; flex-direction: column; min-height: 44px; padding: 0; border: 0; background: none; color: var(--color-principal);
  text-align: left; cursor: pointer; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.tl-logo-nom { font: 700 32px/1 var(--fuente-titulos); letter-spacing: -.04em; }
.tl-punto { font-style: normal; color: var(--color-accion); }
.tl-logo-sub { margin-top: 2px; font: 500 13px/1.3 var(--fuente-texto); white-space: nowrap; color: var(--color-suave); }
.tl-abierto { margin: 0 0 0 auto; font-size: 13px; text-align: right; color: var(--color-suave); }
.tl-abierto strong { display: block; color: var(--color-texto); }

.tl-cli { padding: var(--e5) max(16px, env(safe-area-inset-right, 0px)) var(--e6) max(16px, env(safe-area-inset-left, 0px)); }
.u .tl-cli h1 { font-size: 30px; line-height: 1.05; color: var(--color-texto); letter-spacing: -.03em; text-wrap: balance; }
.u .tl-cli h2 { font-size: 19px; line-height: 1.2; color: var(--color-texto); letter-spacing: -.02em; }
.tl-cli p { margin: 0; }
.tl-cabeza { display: flex; flex-direction: column; gap: var(--e2); margin-bottom: var(--e4); }
.tl-atras { align-self: flex-start; margin-left: calc(-1 * var(--e2)); }
.tl-pasos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--e1); }
.tl-pasos span { height: 4px; background: var(--color-bloque); }
.tl-pasos span.on { background: var(--color-principal); }
.tl-seccion { display: flex; flex-direction: column; gap: var(--e3); margin-top: var(--e6); }
.tl-seccion-cab { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e3); }
.tl-pie { margin-top: var(--e6); }

/* Barra de la app: abajo, como en cualquier app del móvil */
.tl-tabs { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: var(--color-superficie); border-top: 1px solid var(--color-linea); }
.tl-tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px;
  border: 0; border-top: 3px solid transparent; background: none; color: var(--color-suave); font: 700 12px/1.2 var(--fuente-texto); cursor: pointer; }
.tl-tabs button[aria-current=page] { color: var(--color-principal-oscuro); border-top-color: var(--color-principal); }
.tl-tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.tl-tabs[hidden] { display: none; }
body[data-lado=cli] .tl-pantalla { padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 980px) {
  .tl-tabs { position: sticky; flex: none; padding: 0; }
  body[data-lado] .tl-pantalla { padding-bottom: 0; }
}

/* Tarjetas que se trabajan por separado: la próxima cita, «ya te toca» y cada corte */
.tl-tarjeta { display: flex; flex-direction: column; gap: var(--e3); padding: var(--e4); border: 1px solid var(--color-linea);
  border-radius: var(--radio); background: var(--color-superficie); }
.tl-tarjeta.destaca { border-color: var(--color-principal); border-width: 1.5px; }
.tl-grande { font: 500 64px/0.95 var(--fuente-titulos); letter-spacing: -.04em; color: var(--color-principal); }
.tl-dia-grande { font: 600 22px/1.1 var(--fuente-titulos); }
.tl-ciclo { display: flex; flex-direction: column; gap: var(--e1); }
.tl-ciclo .barra { height: 3px; background: var(--color-bloque); }
.tl-ciclo .barra span { display: block; height: 100%; background: var(--color-principal); }
.tl-ciclo .n { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-suave); }
.tl-botones { display: flex; flex-wrap: wrap; gap: var(--e2); }
.tl-botones .u-btn-accion { flex: 1 1 100%; min-height: 52px; }
.tl-saludo { display: flex; align-items: center; gap: var(--e3); margin-bottom: var(--e4); }
.tl-ini { display: flex; align-items: center; justify-content: center; flex: none; width: 48px; height: 48px; border-radius: var(--radio);
  background: var(--color-bloque); color: var(--color-principal); font: 600 28px/1 var(--fuente-titulos); }
.tl-info { display: grid; grid-template-columns: max-content 1fr; gap: var(--e2) var(--e4); margin: 0; font-size: 14px; }
.tl-info dt { font: 700 12px/1.6 var(--fuente-texto); color: var(--color-principal-oscuro); text-transform: uppercase; letter-spacing: .04em; }
.tl-info dd { margin: 0; }

/* Un corte del historial */
.tl-corte-cab { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e3); }
.tl-corte-cab .eur { font: 600 22px/1 var(--fuente-titulos); color: var(--color-principal); font-variant-numeric: tabular-nums; }
.tl-nota { font-size: 14px; color: var(--color-suave); }
.tl-fotos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e1); }
.tl-fotos img, .tl-fotos video { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radio-peq); background: var(--color-bloque); }
.tl-sinfoto { padding: var(--e3); border: 1px dashed var(--color-borde-campo); border-radius: var(--radio-peq); font-size: 13px; color: var(--color-suave); }

/* Servicios: baldosas que se tocan */
.tl-servicios { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }
.tl-serv { display: flex; flex-direction: column; justify-content: space-between; gap: var(--e3); min-height: 120px; padding: var(--e4);
  border: 1px solid var(--color-linea); border-radius: var(--radio); background: var(--color-superficie); color: var(--color-texto);
  font: inherit; text-align: left; cursor: pointer; transition: border-color 150ms; }
.tl-serv:hover, .tl-barb:hover { border-color: var(--color-principal); }
.tl-serv:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 88px; }
.tl-serv .nom { font: 600 22px/1 var(--fuente-titulos); letter-spacing: -.02em; }
.tl-serv .det { font-size: 13px; color: var(--color-suave); }
.tl-serv .pie { display: flex; align-items: baseline; justify-content: space-between; gap: var(--e2); }
.tl-serv .eur { font: 600 30px/1 var(--fuente-titulos); color: var(--color-principal); font-variant-numeric: tabular-nums; }
.tl-siempre { width: 100%; margin-bottom: var(--e3); }

/* Barberos */
.tl-barberos { display: flex; flex-direction: column; gap: var(--e2); }
.tl-barb { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--e1) var(--e4); align-items: center; padding: var(--e3);
  border: 1px solid var(--color-linea); border-radius: var(--radio); background: var(--color-superficie); color: var(--color-texto);
  font: inherit; text-align: left; cursor: pointer; transition: border-color 150ms; }
.tl-barb.tuyo { border-color: var(--color-principal); }
.tl-mono { grid-row: 1 / span 3; display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; padding: var(--e1) var(--e2);
  border-radius: var(--radio); background: var(--color-bloque); color: var(--color-principal); font: 600 20px/1 var(--fuente-titulos); }
.tl-mono.todos { color: var(--color-texto); }
.tl-barb .nom { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2); font: 600 22px/1 var(--fuente-titulos); }
.tl-barb .nom .u-chip { font-family: var(--fuente-texto); text-transform: none; }
.tl-barb .det { font-size: 13px; color: var(--color-suave); }
.tl-barb .hueco { font-size: 13px; font-weight: 700; color: var(--color-principal-oscuro); }

/* Día y hora */
.tl-dias { display: flex; gap: var(--e2); overflow-x: auto; padding-bottom: var(--e2); margin-bottom: var(--e4); scrollbar-width: none; }
.tl-dias::-webkit-scrollbar { display: none; }
.tl-dia { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 68px; padding: var(--e2) 0;
  border: 1px solid var(--color-linea); border-radius: var(--radio); background: var(--color-superficie); color: var(--color-texto); font: inherit; cursor: pointer; }
.tl-dia .dn { font: 700 12px/1.2 var(--fuente-texto); text-transform: uppercase; letter-spacing: .06em; }
.tl-dia .dd { font: 600 28px/1 var(--fuente-titulos); font-variant-numeric: tabular-nums; }
.tl-dia .dh { font-size: 12px; color: var(--color-suave); }
.tl-dia[aria-pressed=true] { background: var(--color-principal); border-color: var(--color-principal); color: var(--color-sobre-principal); }
.tl-dia[aria-pressed=true] .dh { color: var(--color-sobre-principal); }
.tl-franja { margin: 0 0 var(--e2) !important; }
.tl-horas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e2); margin-bottom: var(--e5); }
.tl-hora { min-height: 44px; border: 1px solid var(--color-principal-oscuro); border-radius: var(--radio); background: transparent;
  color: var(--color-principal-oscuro); font: 700 15px/1 var(--fuente-texto); font-variant-numeric: tabular-nums; cursor: pointer; }
.tl-hora:hover { background: var(--color-bloque); }
.tl-resumen { display: flex; flex-wrap: wrap; gap: var(--e1) var(--e2); margin: 0 0 var(--e4) !important; }

/* Confirmar y datos */
.tl-form { display: flex; flex-direction: column; gap: var(--e4); }
.tl-form input:not([type=checkbox]) { width: 100%; }
.tl-check { display: flex; gap: var(--e3); align-items: flex-start; font-size: 14px; }
.tl-check input { margin-top: 2px; flex: none; }
.tl-form .u-btn-accion { width: 100%; min-height: 52px; }
.tl-o { display: flex; align-items: center; gap: var(--e3); font-size: 13px; color: var(--color-suave); }
.tl-o::before, .tl-o::after { content: ""; flex: 1; height: 1px; background: var(--color-linea); }
.tl-google { width: 100%; }

/* Resguardo de la cita */
.tl-ticket { position: relative; margin: var(--e4) 0; border: 1px solid var(--color-linea); border-radius: var(--radio); background: var(--color-superficie); }
.tl-ticket-a { padding: var(--e4); }
.tl-ticket-a .num { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--color-suave); }
.tl-ticket-a .tl-grande { margin-top: var(--e2); font-size: 76px; }
.tl-ticket-a .tl-dia-grande { margin-top: var(--e1); }
.tl-ticket-b { padding: var(--e4); border-top: 1px solid var(--color-linea); }
.tl-ticket dl, .tl-resumen-cita { display: grid; grid-template-columns: max-content 1fr; gap: var(--e2) var(--e4); margin: 0; }
.tl-ticket dt, .tl-resumen-cita dt { font: 700 12px/1.6 var(--fuente-texto); color: var(--color-principal-oscuro); text-transform: uppercase; letter-spacing: .04em; }
.tl-ticket dd, .tl-resumen-cita dd { margin: 0; font-weight: 700; }

/* Aviso que llega al móvil (flota: lleva la sombra) */
.tl-noti { position: fixed; z-index: 80; top: calc(var(--e2) + env(safe-area-inset-top, 0px));
  left: calc(var(--e2) + env(safe-area-inset-left, 0px)); right: calc(var(--e2) + env(safe-area-inset-right, 0px));
  max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--e1) var(--e3); align-items: start;
  padding: var(--e3); border: 1px solid var(--color-linea); border-radius: var(--radio); background: var(--color-bloque);
  color: var(--color-texto); box-shadow: var(--sombra-flota); font: inherit; text-align: left; cursor: pointer;
  transform: translateY(calc(-100% - 24px)); transition: transform 200ms ease-out; }
.tl-noti.on { transform: none; }
.tl-noti[hidden] { display: none; }
@media (min-width: 980px) { .tl-noti { position: absolute; top: 40px; } }
.tl-noti .app { grid-row: 1 / span 2; }
.tl-noti .tit { display: flex; justify-content: space-between; gap: var(--e2); font-size: 13px; }
.tl-noti .tit span { color: var(--color-suave); }
.tl-noti .txt { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-av { display: flex; align-items: center; justify-content: center; flex: none; width: 40px; height: 40px; border-radius: var(--radio);
  background: var(--color-principal); color: var(--color-sobre-principal); font: 600 24px/1 var(--fuente-titulos); }

/* Chat simulado: neutro, sin la marca ni los colores de ninguna app de mensajería */
.tl-chat { min-height: 100%; display: flex; flex-direction: column; background: var(--color-bloque); }
.tl-pantalla.en-chat { background: var(--color-bloque); }
.tl-chat-cab { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--e3);
  padding: calc(var(--e2) + env(safe-area-inset-top, 0px)) var(--e3) var(--e2); background: var(--color-superficie); border-bottom: 1px solid var(--color-linea); }
.tl-chat-cab strong { display: block; }
.tl-chat-cab div span { font-size: 13px; color: var(--color-suave); }
.tl-msgs { flex: 1; display: flex; flex-direction: column; gap: var(--e3); padding: var(--e4) var(--e3); }
.tl-sis { align-self: center; max-width: 92%; margin: var(--e2) 0 0; padding: var(--e1) var(--e3); border-radius: var(--radio-peq);
  background: var(--color-fondo); color: var(--color-suave); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-align: center; }
.tl-msg { max-width: 86%; padding: var(--e2) var(--e3); border-radius: var(--radio); font-size: 15px; white-space: pre-line; }
.tl-msg time { display: block; margin-top: var(--e1); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--color-suave); }
.tl-msg.neg { align-self: flex-start; background: var(--color-superficie); }
.tl-msg.cli { align-self: flex-end; background: var(--color-principal); color: var(--color-sobre-principal); font-weight: 700; }
.tl-msg.cli time { color: var(--color-sobre-principal); }
.tl-msg img, .tl-msg video { display: block; width: 180px; max-width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radio-peq); }
.tl-msg .u-btn { margin-top: var(--e2); white-space: normal; }
.tl-msg.entra { animation: tl-entra 200ms ease-out; }
@keyframes tl-entra { from { opacity: 0; transform: translateY(6px); } }
.tl-resp { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: var(--e2); padding: var(--e3);
  padding-bottom: calc(var(--e3) + env(safe-area-inset-bottom, 0px)); background: var(--color-superficie); border-top: 1px solid var(--color-linea); }
.tl-resp p { flex: 1 0 100%; margin: 0; }
.tl-resp .u-btn { flex: 1 1 0; padding: 0 var(--e2); }

/* ---------- El mostrador de la barbería ---------- */
.tl-neg { padding: var(--e4) max(16px, env(safe-area-inset-right, 0px)) var(--e7) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 980px) { .tl-neg { padding: 0; } }
.tl-ncab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e3); padding-bottom: var(--e3);
  border-bottom: 1px solid var(--color-linea); }
.tl-ncab .tl-logo { flex-direction: row; align-items: baseline; gap: var(--e2); }
.tl-ncab .tl-logo-nom { font-size: 28px; }
.tl-ncab .tl-logo-sub { margin: 0; color: var(--color-suave); }
.tl-ndia { display: flex; align-items: center; gap: var(--e2); }
.u .tl-ndia h1 { min-width: 0; font-size: 24px; color: var(--color-texto); text-align: center; }
@media (min-width: 980px) { .u .tl-ndia h1 { min-width: 220px; } }

.tl-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: var(--e4) 0 var(--e2);
  background: var(--color-linea); border: 1px solid var(--color-linea); border-radius: var(--radio); overflow: hidden; }
@media (min-width: 640px) { .tl-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tl-kpi { padding: var(--e3); background: var(--color-superficie); display: flex; flex-direction: column; gap: var(--e1); min-width: 0; }
.tl-kpi .v { font: 600 34px/1 var(--fuente-titulos); font-variant-numeric: tabular-nums; }
.tl-kpi .v.cifra { text-decoration: underline; text-decoration-color: var(--color-destacado); text-decoration-thickness: 4px; text-underline-offset: 6px; }
.tl-kpi .barra { height: 4px; margin-top: var(--e1); background: var(--color-bloque); }
.tl-kpi .barra span { display: block; height: 100%; background: var(--color-principal); transition: width 200ms; }
.tl-kpi .n { font-size: 12px; color: var(--color-suave); }
.tl-mes { display: flex; flex-wrap: wrap; gap: var(--e1) var(--e4); margin: 0 0 var(--e5); font-size: 13px; color: var(--color-suave); }
.tl-mes strong { color: var(--color-texto); font-variant-numeric: tabular-nums; }
.tl-mes .cambio, .tl-mes .cambio strong { color: var(--color-principal-oscuro); }

/* Cuadrante: una columna por barbero; cada cita mide lo que dura */
.tl-cuad-cab { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: var(--e2); align-items: end; padding-bottom: var(--e2);
  position: sticky; top: 0; z-index: 3; background: var(--color-fondo); }
.tl-cuad-cab strong { font: 600 20px/1 var(--fuente-titulos); }
.tl-cuad-cab span { display: block; font-size: 12px; color: var(--color-suave); }
.tl-cuad { position: relative; display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: var(--e2); }
.tl-eje { position: relative; }
.tl-eje span { position: absolute; left: 0; font-size: 12px; font-weight: 700; color: var(--color-suave); font-variant-numeric: tabular-nums; transform: translateY(-50%); }
.tl-eje span:first-child { transform: none; }
.tl-col { position: relative; background: var(--color-superficie); border-radius: var(--radio); }

<script>
(function () {
  'use strict';

  /* ---------- Datos de la barbería (inventados) ---------- */
  var SERV = [
    { id: 'corte',  nom: 'Corte',          corto: 'Corte',       min: 30, eur: 16 },
    { id: 'cb',     nom: 'Corte y barba',  corto: 'Corte+barba', min: 45, eur: 22 },
    { id: 'barba',  nom: 'Barba',          corto: 'Barba',       min: 20, eur: 10 },
    { id: 'rapado', nom: 'Rapado',         corto: 'Rapado',      min: 20, eur: 12 },
    { id: 'inf',    nom: 'Corte infantil', corto: 'Infantil',    min: 30, eur: 13 }
  ];
  var BARB = [
    { id: 'Toni',    det: 'Cortes clásicos y a tijera' },
    { id: 'Marc',    det: 'Barba y afeitado a navaja' },
    { id: 'Yassine', det: 'Degradados y diseños' }
  ];
  var NOMBRES = ['Oriol', 'Pau', 'Arnau', 'Àlex', 'Karim', 'Sergi', 'Iker', 'Bilal', 'Dani', 'Nil', 'Adrià', 'Youssef',
    'Víctor', 'Joan', 'Marcel', 'Hugo', 'Ricard', 'Pol', 'Aleix', 'Hamza', 'Enric', 'Lucas', 'Biel', 'Gerard', 'Xavi',
    'Rubén', 'Imran', 'Quim', 'Mateo', 'Albert', 'Eric', 'Martí', 'Abdel', 'Roger', 'Ivan', 'Jan', 'Samir', 'Carles',
    'Luis', 'Guillem'];
  /* El cliente habitual de la demo: viene cada 4 semanas con Toni */
  var HABITUAL = { nombre: 'Jordi', tel: '612345218', google: true, ok: true };
  var ABRE = 600, CIERRA = 1230, PASO = 30, PPM = 1.6;   // minutos desde las 00:00 (10:00 a 20:30) y píxeles por minuto
  var DIA_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var DIA_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MES_BASE = { web: 64, avisos: 132, ausencias: 9, resenas: 17 };   // cifras de ejemplo del mes
  var DIRECCION = 'Carrer de Manso, Sant Antoni, Barcelona';

  var ICO = {
    atras: '<svg class="u-icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    sig: '<svg class="u-icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
    cal: '<svg class="u-icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>',
    foto: '<svg class="u-icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
  };

  /* ---------- Utilidades ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dos(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(m) { return dos(Math.floor(m / 60)) + ':' + dos(m % 60); }
  function clave(d) { return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()); }
  function fecha(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function ddmm(k) { var d = fecha(k); return dos(d.getDate()) + '/' + dos(d.getMonth() + 1); }
  function ddmmaaaa(k) { return ddmm(k) + '/' + fecha(k).getFullYear(); }
  function diaLargo(k) { return DIA_L[fecha(k).getDay()] + ' ' + ddmmaaaa(k); }
  function sumarDias(k, n) { var d = fecha(k); d.setDate(d.getDate() + n); return clave(d); }
  function diasEntre(a, b) { return Math.round((fecha(b) - fecha(a)) / 864e5); }
  function eur(n) { return n.toLocaleString('es-ES') + ' €'; }
  function serv(id) { return SERV.filter(function (s) { return s.id === id; })[0]; }
  function ahoraMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function hoy() { return clave(new Date()); }
  function abierto(d) { return d.getDay() >= 2 && d.getDay() <= 6; }
  function diasAbiertos(n) {
    var out = [], d = new Date(); d.setHours(12, 0, 0, 0);
    for (var i = 0; out.length < n && i < 21; i++) { if (abierto(d)) out.push(clave(d)); d.setDate(d.getDate() + 1); }
    return out;
  }
  function otroDiaAbierto(k, paso) { var d = fecha(k); do { d.setDate(d.getDate() + paso); } while (!abierto(d)); return clave(d); }
  function abiertoAntes(n) { var k = sumarDias(hoy(), -n); return abierto(fecha(k)) ? k : otroDiaAbierto(k, -1); }
  function cuando(k) { return k === hoy() ? 'hoy' : k === sumarDias(hoy(), 1) ? 'mañana' : DIA_C[fecha(k).getDay()] + ' ' + ddmm(k); }
  function mascara(tel) { return tel.charAt(0) + '•• ••• ' + tel.slice(-3); }
  function enIframe() { try { return window.self !== window.top; } catch (e) { return true; } }

  /* Agenda inventada pero estable: la misma para cada día cada vez que se abre */
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function azar(seed) {
    var a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  var cache = {};
  function generadas(k) {
    if (cache[k]) return cache[k];
    var sab = fecha(k).getDay() === 6, out = [];
    /* Un nombre distinto para cada cita del día; si se acaban, con la inicial del apellido */
    var rn = azar(hash(k)), noms = NOMBRES.slice(), n = 0;
    for (var i = noms.length - 1; i > 0; i--) { var j = Math.floor(rn() * (i + 1)), x0 = noms[i]; noms[i] = noms[j]; noms[j] = x0; }
    function nombre() { var i = n++; return noms[i % noms.length] + (i >= noms.length ? ' ' + 'MPRGSTV'.charAt(i % 7) + '.' : ''); }
    BARB.forEach(function (b) {
      var r = azar(hash(k + b.id)), t = ABRE;
      while (t < CIERRA) {
        var p = sab ? 0.55 : (t < 750 || t >= 1050 ? 0.5 : 0.3);
        if (r() < p) {
          var x = r(), s = x < 0.45 ? SERV[0] : x < 0.7 ? SERV[1] : x < 0.8 ? SERV[2] : x < 0.9 ? SERV[3] : SERV[4];
          if (t + s.min <= CIERRA) {
            out.push({ id: k + b.id + t, dia: k, barbero: b.id, ini: t, serv: s.id, cliente: nombre() });
            t += Math.ceil(s.min / PASO) * PASO; continue;
          }
        }
        t += PASO;
      }
    });
    return (cache[k] = out);
  }
  function citasDe(k) {
    var l = generadas(k).concat(st.mias.filter(function (c) { return c.dia === k && c.estado !== 'anulada'; }));
    return l.sort(function (a, b) { return a.ini - b.ini || a.barbero.localeCompare(b.barbero); });
  }
  function cita(id) { return st.mias.filter(function (c) { return c.id === id; })[0]; }
  function buscarCita(id) { return cita(id) || generadas(id.slice(0, 10)).filter(function (c) { return c.id === id; })[0]; }
  function pasada(k, ini) { return k < hoy() || (k === hoy() && ini <= ahoraMin() + 15); }
  function barberoLibre(k, b, ini, min) {
    if (ini + min > CIERRA || pasada(k, ini)) return false;
    return !citasDe(k).some(function (c) { return c.barbero === b && c.ini < ini + min && ini < c.ini + serv(c.serv).min; });
  }
  function libreQuien(k, b, ini, min) {
    var lista = b === '*' ? BARB.map(function (x) { return x.id; }) : [b];
    for (var i = 0; i < lista.length; i++) if (barberoLibre(k, lista[i], ini, min)) return lista[i];
    return null;
  }
  function horasLibres(k, b, min) {
    var out = [];
    for (var t = ABRE; t + min <= CIERRA; t += PASO) if (libreQuien(k, b, t, min)) out.push(t);
    return out;
  }
  function horaCercana(k, b, ini, min) {
    var l = horasLibres(k, b, min).sort(function (x, y) { return Math.abs(x - ini) - Math.abs(y - ini) || x - y; });
    return l.length ? { t: l[0], b: b } : null;
  }
  function primerHueco(b, min) {
    var dias = diasAbiertos(6);
    for (var i = 0; i < dias.length; i++) { var h = horasLibres(dias[i], b, min); if (h.length) return cuando(dias[i]) + ' a las ' + hhmm(h[0]); }
    return null;
  }

  /* ---------- Estado de la demo ---------- */
  var st, tPost1 = null, tPost2 = null;
  function reiniciar(nuevo) {
    st = { lado: 'cli', vista: 'inicio', serv: null, barb: null, dia: null, ini: null, nombre: '', tel: '', error: '',
      usuario: nuevo ? null : JSON.parse(JSON.stringify(HABITUAL)), historial: [], mias: [], chat: [], fase: null, actual: null,
      cambiando: null, fotoPara: null, agDia: null, flash: null, mes: { web: 0, avisos: 0, ausencias: 0, resenas: 0 }, cambioMes: null };
    if (!nuevo) st.historial = [
      { id: 'h1', dia: abiertoAntes(26), barbero: 'Toni', serv: 'cb', ini: 690, nota: 'Degradado bajo, arriba a tijera y barba perfilada', fotos: [] },
      { id: 'h2', dia: abiertoAntes(54), barbero: 'Toni', serv: 'cb', ini: 1080, nota: 'Igual que la otra vez, un poco más corto de lados', fotos: [] },
      { id: 'h3', dia: abiertoAntes(83), barbero: 'Marc', serv: 'corte', ini: 1020, nota: 'Primera visita', fotos: [] }
    ];
    ocultarNoti();
    clearTimeout(tPost1); clearTimeout(tPost2);
  }
  function proximas() {
    return st.mias.filter(function (c) { return c.estado !== 'anulada' && !c.hecha_ya && !pasada(c.dia, c.ini); })
      .sort(function (a, b) { return a.dia < b.dia ? -1 : a.dia > b.dia ? 1 : a.ini - b.ini; });
  }
  function barberoHabitual() {
    var n = {}; st.historial.forEach(function (h) { n[h.barbero] = (n[h.barbero] || 0) + 1; });
    var b = null; Object.keys(n).forEach(function (k) { if (!b || n[k] > n[b]) b = k; });
    return b;
  }

  /* ---------- Calendario ---------- */
  function fechaCal(k, m) { return k.replace(/-/g, '') + 'T' + dos(Math.floor(m / 60)) + dos(m % 60) + '00'; }
  function enlaceGoogle(c) {
    var s = serv(c.serv);
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Barbería Tallat · ' + s.nom + ' con ' + c.barbero) +
      '&dates=' + fechaCal(c.dia, c.ini) + '/' + fechaCal(c.dia, c.ini + s.min) + '&ctz=Europe/Madrid' +
      '&location=' + encodeURIComponent(DIRECCION) + '&details=' + encodeURIComponent('Para cambiarla o anularla, responde al WhatsApp de la barbería.');
  }
  function bajarIcs(c) {
    var s = serv(c.serv);
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Barberia Tallat//Demo Utilo//ES', 'BEGIN:VEVENT', 'UID:' + c.id + '@demo-tallat',
      'DTSTAMP:' + fechaCal(hoy(), ahoraMin()), 'DTSTART;TZID=Europe/Madrid:' + fechaCal(c.dia, c.ini), 'DTEND;TZID=Europe/Madrid:' + fechaCal(c.dia, c.ini + s.min),
      'SUMMARY:Barbería Tallat · ' + s.nom + ' con ' + c.barbero, 'LOCATION:' + DIRECCION.replace(/,/g, '\\,'),
      'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:Cita en Barbería Tallat', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = 'cita-barberia-tallat.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function botonesCalendario(c) {
    return '<a class="u-btn" href="' + enlaceGoogle(c) + '" target="_blank" rel="noopener">' + ICO.cal + 'Añadir a Google Calendar</a>' +
      (enIframe() ? '' : '<button type="button" class="u-btn" data-ics="' + c.id + '">' + ICO.cal + 'Calendario del móvil</button>');
  }

  /* ---------- Pantallas de la app del cliente ---------- */
  var cliEl = document.getElementById('cli'), negEl = document.getElementById('neg');
  var pantalla = document.getElementById('pantalla'), cab = document.getElementById('cab'), tabs = document.getElementById('tabs');

  function estadoAbierto() {
    var k = hoy(), m = ahoraMin();
    if (abierto(fecha(k)) && m >= ABRE && m < CIERRA) return '<strong>Abierto ahora</strong>hasta las 20:30';
    var sig = abierto(fecha(k)) && m < ABRE ? k : otroDiaAbierto(k, 1);
    return '<strong>Cerrado</strong>abre ' + (sig === k ? 'hoy' : sig === sumarDias(k, 1) ? 'mañana' : 'el ' + DIA_C[fecha(sig).getDay()]) + ', 10:00';
  }
  function cabeza(paso, titulo) {

  function responder(txt) {

    else st.error = '';
    if (st.error) { pintarCli(false); var el = cliEl.querySelector('.u-error'); if (el) el.scrollIntoView({ block: 'center' }); return; }
    var min = serv(st.serv).min, quien = libreQuien(st.dia, st.barb, st.ini, min);
    if (!quien) { st.error = 'Esa hora se acaba de ocupar. Vuelve atrás y elige otra.'; pintarCli(false); return; }
    if (u) { u.tel = tel; u.ok = true; } else st.usuario = { nombre: nombre.split(' ')[0], tel: tel, google: false, ok: true };
    clearTimeout(tPost1); clearTimeout(tPost2);
    var vieja = st.cambiando && cita(st.cambiando);
    if (vieja) anular(vieja, 'cambio');
    var r = nuevaCita(st.dia, quien, st.ini, st.serv, st.usuario.nombre, tel, 'web');
    r.cambio = !!vieja; st.cambiando = null;
    st.actual = r.id;
    st.chat = [];
    msg('neg', textoConfirmacion(r));
    msg('sis', r.dia === hoy() ? 'Dos horas antes de la cita' : 'El día antes, a las 19:00');
    msg('neg', textoRecordatorio(r), r.dia === hoy() ? hhmm(Math.max(r.ini - 120, ahoraMin())) : '19:00');
    st.fase = 'recordatorio';
    st.agDia = r.dia; st.flash = r.id;
    sumarMes('avisos', 2); if (!vieja) sumarMes('web');
    ir('reservada');
    mostrarFlash();
    avisoMostrador(vieja ? 'Cita cambiada' : 'Nueva cita', r.cliente + ' · ' + cuando(r.dia) + ' a las ' + hhmm(r.ini) + ' con ' + quien + (vieja ? ' (antes ' + cuando(vieja.dia) + ' a las ' + hhmm(vieja.ini) + ').' : '. WhatsApp de confirmación enviado.'));
    notiTimer = setTimeout(mostrarNoti, 1800);
  });

  /* ---------- Menú oculto: pulsación larga en un logo (o tecla M) ---------- */
  var menu = document.getElementById('menu'), pulsa = null, largo = false;
  function abrirMenu() { document.getElementById('menu-chat').disabled = !st.actual; menu.classList.add('abierto'); menu.querySelector('button').focus(); }
  function cerrarMenu() { menu.classList.remove('abierto'); }
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('[data-logo]')) return;
    largo = false; pulsa = setTimeout(function () { largo = true; abrirMenu(); }, 600);
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) { document.addEventListener(ev, function () { clearTimeout(pulsa); }); });
  document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-logo]')) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    var l = e.target.closest('[data-logo]'); if (!l) return;
    if (largo) { largo = false; return; }
    if (l.closest('#cab')) { st.cambiando = null; ir('inicio'); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { cerrarMenu(); cerrarVentana(); }
    if ((e.key === 'm' || e.key === 'M') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) abrirMenu();
  });
  menu.addEventListener('click', function (e) {
    if (e.target === menu) return cerrarMenu();
    var b = e.target.closest('button[data-ir]'); if (!b) return;
    var v = b.dataset.ir;
    cerrarMenu();
    if (v === 'cerrar') return;
    if (v === 'habitual' || v === 'nuevo') { reiniciar(v === 'nuevo'); pintar(); return; }
    if (v === 'neg') { irNeg(); return; }
    ocultarNoti();
    ir(v);
  });

  /* El reloj del móvil y la línea de «ahora» se mueven solos */
  setInterval(function () { document.getElementById('reloj').textContent = hhmm(ahoraMin()); if (!fichaEl.classList.contains('abierto')) pintarNeg(); }, 60000);

  /* Enlace directo al mostrador: #mostrador */
  reiniciar(false);
  if (location.hash === '#mostrador') st.lado = 'neg';
  pintar();
})();
</script>
