<!-- T0599: la app de ejemplo de la sección Listado (nucleo/secciones/listado.js) con el marco de verdad (nucleo/nucleo.js: el
     menú a la izquierda en el ordenador y abajo en el móvil) y la capa de tablas de verdad (kanban4/tablas.js), con los datos
     inventados de ejemplo-telas.js (con el modelo del Excel GESTION de Marta, T0598) y un motor de mentira en memoria (motor-falso.js):
     sin Google ni Supabase, y lo que se cambia se pierde al recargar. npm run local → http://localhost:8080/dev/listado/
     (#duena, #ayudante o #admin: quién entra). La app de Marta de verdad, sobre su Excel GESTION (T0598), llega con T0600 a T0602. -->
<link rel="stylesheet" href="../../utilo/marca.css?v=47">
<link rel="stylesheet" href="../../estilos/base.css?v=94">
<style>
  /* El selector de quién entra: fuera del marco (que rehace el body), abajo a la derecha, encima de la barra del móvil. */
  #mf-quien { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 90;
    display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-radius: 999px; background: #1C1C1C; color: #fff;
    font: 600 13px/1.2 system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #mf-quien select { font: inherit; border-radius: 999px; border: 0; padding: 4px 8px; max-width: 60vw; }
  @media (min-width: 900px) { #mf-quien { bottom: max(16px, env(safe-area-inset-bottom, 0px)); } }
</style>
<script>
  window.KANBAN = { clave: 'listado-ejemplo', marca: 'utilo', nombreApp: 'Telas', api: 'motor-de-ejemplo' };
  // Las tablas viven en el motor de mentira: sin copia en el dispositivo (IndexedDB), que traería las de otra vez.
  try { Object.defineProperty(window, 'indexedDB', { value: undefined, configurable: true }); } catch (e) {}
</script>
