<!DOCTYPE html>

<title>Utilo DEV</title>
<!-- T0441 · T0446: la app «Utilo DEV». En utilo-web/dev-ramas/ (lo pone ahí herramientas/dev-ramas.js selector, desde main).
     Al abrirla, vuelve donde se dejó (la página de una rama, ya dentro). «Probar en DEV» (?probar, o la línea DEV de abajo
     de cada página, dev-ramas/marco.js): Iniciativa → Rama → Web → Entrar como; «Abrir» entra ya, sin pantalla de entrar:
     como «Yo» (Google) o como una persona de prueba de la iniciativa (personas_de_prueba de su Supabase de DEV y su código
     del buzón de pruebas, solo @ejemplo.com). Su manifest abarca dev-ramas/ entero: las páginas de las ramas se abren
     dentro de la app.
     T0449 · Con una rama elegida, su tarea en el DAILY de verdad (ramas.json · daily: el Supabase de Utilo de producción,
     con la sesión de la plataforma de Utilo en este sitio, o entrando con Google una vez) y «Pedir cambios» si está Para
     revisar o Aprobada: pedir_cambios() de la base, el mismo camino que la ficha.
     T0450 · «Verlo en DEV» de la ficha de una tarea: ?probar&tarea=T0xxx[&web=dev/plataforma/[&como=x@ejemplo.com]] elige
     la rama de esa tarea, esa web y esa persona (sin «como», tú con Google) y entra ya. Con la tarea, su «Qué mirar». -->

<style>
  :root { --amarillo: #F5C518; --fondo: #F4F3EF; --caja: #FFFFFF; --texto: #1C1C1C; --suave: #5C5A55; --linea: #E6E3DC;
    --separa: #EEECE6; --marca: #FFF6D6; --boton: #1C1C1C; --boton-texto: #FFFFFF; --aviso: #7A4A00; --aviso-fondo: #FFF0D6;
    --flecha: #8A877F; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo: #1A1915; --caja: #262520; --texto: #F2F0EA; --suave: #B5B1A6; --linea: #3A3830;
      --separa: #312F28; --marca: #3A3218; --boton: #F2F0EA; --boton-texto: #1A1915; --aviso: #FFC27A; --aviso-fondo: #3A2A10; --flecha: #8F8B80; }
  }
  :root[data-theme="dark"] { --fondo: #1A1915; --caja: #262520; --texto: #F2F0EA; --suave: #B5B1A6; --linea: #3A3830;
    --separa: #312F28; --marca: #3A3218; --boton: #F2F0EA; --boton-texto: #1A1915; --aviso: #FFC27A; --aviso-fondo: #3A2A10; --flecha: #8F8B80; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--amarillo); }
  /* El borde amarillo, como en las páginas de las ramas (marco.js): la hoja va dentro, con las esquinas redondeadas. */
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--amarillo); color: var(--texto);
    font: 16px/1.4 system-ui, -apple-system, sans-serif; padding: 0 6px calc(env(safe-area-inset-bottom, 0px) + 6px); display: flex; flex-direction: column; }
  .hoja { flex: 1; min-width: 0; background: var(--fondo); border-radius: 16px; display: flex; flex-direction: column; }
  /* La cabecera, sobre el amarillo (fuera de la hoja) y sin ir pegada arriba: desde iOS 26 la franja de la hora toma el color
     de lo que va fijo o pegado arriba, y difumina lo que queda debajo; así toma el amarillo y difumina amarillo sobre amarillo. */
  header { color: #1C1C1C; padding: calc(env(safe-area-inset-top, 0px) + 6px) 4px 6px; display: flex; align-items: center; gap: 4px; min-height: 56px; }
  header h1 { margin: 0; font-size: 17px; flex: 1; display: flex; flex-direction: column; }
  header h1 small { font-size: 13px; font-weight: 400; color: #5F4B00; }
  header.centro h1 { text-align: center; }
  .icono { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0;
    color: inherit; padding: 0; border-radius: 12px; cursor: pointer; flex: none; }
  .icono svg { stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .hueco { width: 44px; flex: none; }
  main { flex: 1; padding: 12px 12px 16px; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .grupo { background: var(--caja); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  .fila { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; min-height: 56px; background: transparent; border: 0;
    border-top: 1px solid var(--separa); color: var(--texto); font: inherit; text-align: left; cursor: pointer; text-decoration: none; }
  .grupo > .fila:first-child, .grupo > .bloque:first-child { border-top: 0; }
  .fila .que { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fila .que span { overflow-wrap: anywhere; }
  .etiqueta { font-size: 13px; color: var(--suave); }
  .valor { font-size: 16px; font-weight: 600; }
  .fila svg { stroke: var(--flecha); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .fila.elegida { background: var(--marca); }
  .fila.elegida svg { stroke: var(--texto); }
  .fila .nombre { font-size: 15px; font-weight: 600; }
  .fila .dato { font-size: 13px; color: var(--suave); }
  .fila .falta { font-size: 13px; color: var(--aviso); }
  .bloque { padding: 12px 14px 14px; border-top: 1px solid var(--separa); display: flex; flex-direction: column; gap: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1px solid var(--linea); background: var(--caja); color: var(--texto);
    font: 500 14px/1.2 system-ui, -apple-system, sans-serif; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--boton); color: var(--boton-texto); border-color: var(--boton); font-weight: 600; }
  .aviso { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--aviso-fondo); color: var(--aviso);
    font-size: 14px; line-height: 1.4; margin: 0; }
  .aviso a { color: inherit; font-weight: 600; }
  .titulo { font-size: 12px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; padding: 0 4px; margin: 0 0 6px; }
  .nota { margin: 0; padding: 0 4px; font-size: 13px; color: var(--suave); line-height: 1.4; }
  .vacio { text-align: center; color: var(--suave); padding: 32px 8px; margin: 0; }
  .reciente { display: block; width: 100%; padding: 12px 14px; min-height: 48px; border-radius: 12px; background: var(--caja); border: 1px solid var(--linea);
    color: var(--texto); font: 14px/1.35 system-ui, -apple-system, sans-serif; text-align: left; cursor: pointer; margin: 0 0 8px; overflow-wrap: anywhere; }
  .buscar { display: flex; align-items: center; gap: 8px; background: var(--caja); border: 1px solid var(--linea); border-radius: 12px; padding: 0 12px; height: 44px; }
  .buscar svg { stroke: var(--suave); fill: none; stroke-width: 2.2; stroke-linecap: round; flex: none; }
  .buscar input { border: 0; outline: 0; flex: 1; min-width: 0; font: 16px system-ui, -apple-system, sans-serif; background: transparent; color: var(--texto); }
  .mas { background: transparent; border: 0; color: var(--suave); font: 14px system-ui, -apple-system, sans-serif; text-align: left; padding: 8px 4px; cursor: pointer; min-height: 44px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--boton); color: var(--boton-texto); display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 700; flex: none; }
  footer { position: sticky; bottom: 0; padding: 10px 12px 12px; background: var(--fondo); border-radius: 0 0 16px 16px; }
  footer > div { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .abrir { display: block; width: 100%; padding: 15px; min-height: 52px; border-radius: 14px; border: 0; background: var(--boton); color: var(--boton-texto);
    font: 600 16px system-ui, -apple-system, sans-serif; cursor: pointer; }
  .abrir:disabled { opacity: .55; cursor: default; }
  .estado { margin: 0; font-size: 14px; color: var(--suave); text-align: center; }
  .estado:empty { display: none; }
  .estado.error { color: var(--aviso); }
  /* T0449 · La tarea de la rama y pedir cambios */
  .tarea .tt { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .tarea textarea { width: 100%; min-height: 84px; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 10px; background: var(--fondo);
    color: var(--texto); font: 16px/1.4 system-ui, -apple-system, sans-serif; resize: vertical; }
  .tarea .boton { align-self: flex-start; padding: 10px 16px; min-height: 44px; border-radius: 12px; border: 0; background: var(--boton); color: var(--boton-texto);
    font: 600 15px system-ui, -apple-system, sans-serif; cursor: pointer; }
  .tarea .boton:disabled { opacity: .55; cursor: default; }
  .tarea .hecho { margin: 0; font-size: 14px; }
  .tarea .hecho a { color: inherit; font-weight: 600; }
  .tarea .aviso { padding: 10px 12px; }
  .tarea .mirar { font-size: 15px; white-space: pre-line; overflow-wrap: anywhere; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--texto); outline-offset: 2px; }
  header button:focus-visible { outline-color: #1C1C1C; }
</style>

<body>
<header id="cab"></header>
<div class="hoja">
  <main id="hoja"><p class="vacio">Cargando…</p></main>
  <footer id="pie" hidden><div><p class="estado" id="estado" role="status"></p><button type="button" class="abrir" id="abrir">Abrir</button></div></footer>
</div>
<script>
(function () {
  'use strict';
  var CLAVE = 'dev_app';                 // lo que recuerda la app en este dispositivo (lo comparte con marco.js)
  var NOMBRES = { utilo: 'Utilo', konamigas: 'Konamigas' };
  var VERSION = '__SELECTOR__';          // la pone dev-ramas.js selector; ramas.json dice la publicada
  var ACCION = 'https://github.com/UTILO-DIGITAL/utilo-apps/actions/workflows/supabase.yml';
  var PROBAR = /[?&]probar\b/.test(location.search); // se ha venido a elegir (la línea DEV): no se vuelve sola a la última
  /** T0450 · Lo que pide el enlace «Verlo en DEV»: { tarea, web, como } o null. */
  function pedido(q) {
    var p = new URLSearchParams(q || '');
    var tarea = (/^T\d{4}$/.exec(p.get('tarea') || '') || [])[0];
    return tarea ? { tarea: tarea, web: p.get('web') || '', como: String(p.get('como') || '').toLowerCase() } : null;
  }
  var PEDIDO = pedido(location.search);
  var hoja = document.getElementById('hoja'), cab = document.getElementById('cab'), pie = document.getElementById('pie');
  var estado = document.getElementById('estado'), btnAbrir = document.getElementById('abrir');
  var datos = null, vista = 'probar', filtro = '', verTodas = false, ocupado = false, primera = true;
  var personas = {};                     // iniciativa → { lista } | { error } | { cargando }
  var ICONOS = {
    cerrar: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    volver: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>',
    ir: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
    si: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" stroke-width="2.6"><path d="M5 12l5 5 9-10"/></svg>',
    lupa: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    aviso: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'
  };

  /* ---------- lo guardado ---------- */

  function texto(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function leerLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function ponerLS(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function leer() { try { return JSON.parse(leerLS(CLAVE) || 'null') || {}; } catch (e) { return {}; } }
  function guardar(E) { ponerLS(CLAVE, JSON.stringify(E)); }
  function nombre(ini) { return NOMBRES[ini] || (ini ? ini.charAt(0).toUpperCase() + ini.slice(1) : ''); }
  function ahora() { return Math.floor(Date.now() / 1000); }
  function quienDe(x) { return x && x.como && x.como.tipo === 'prueba' ? x.como.correo : 'yo'; }

  /** «hace 5 min», «hace 3 h», «ayer», «hace 4 días». */
  function hace(iso) {
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (!(s >= 0)) return '';
    if (s < 90) return 'ahora mismo';
    if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
    var d = Math.round(s / 86400);
    return d === 1 ? 'ayer' : 'hace ' + d + ' días';
  }

  /* ---------- las ramas y sus páginas (ramas.json) ---------- */

  function rama(c) { return (datos.ramas || {})[c] || null; }
  function paginasDe(r, ini) { return ((r && r.paginas) || []).filter(function (p) { return p.iniciativa === ini; }); }
  /** Las páginas de esa iniciativa que cambia la rama (dev-ramas.js · cambia); en main, todas. */
  function cambiadas(r, ini) { return paginasDe(r, ini).filter(function (p) { return p.cambia !== false; }); }
  function toca(r, ini) {
    var ps = paginasDe(r, ini);
    if (ps.length && ps[0].cambia !== undefined) return cambiadas(r, ini).length > 0;
    return (r.toca || []).indexOf(ini) >= 0 || !!r.comun; // subidas antes de «cambia»
  }
  function iniciativas() {
    var vistas = {};
    Object.keys(datos.ramas || {}).forEach(function (c) { (datos.ramas[c].paginas || []).forEach(function (p) { if (p.iniciativa) vistas[p.iniciativa] = 1; }); });
    return Object.keys(NOMBRES).filter(function (x) { return vistas[x]; }).concat(Object.keys(vistas).filter(function (x) { return !NOMBRES[x]; }).sort());
  }
  function ramasDe(ini) {
    var rs = datos.ramas || {};
    var todas = Object.keys(rs).filter(function (c) { return c !== 'main' && paginasDe(rs[c], ini).length; })
      .sort(function (a, b) { return String(rs[b].fecha).localeCompare(String(rs[a].fecha)); });
    return { suyas: todas.filter(function (c) { return toca(rs[c], ini); }), otras: todas.filter(function (c) { return !toca(rs[c], ini); }) };
  }
  /** Las webs que se ofrecen: las que cambia la rama; en main, o en una rama que no cambia esa iniciativa, todas. */
  function webs(c, ini) {
    var r = rama(c);
    if (!r) return [];
    var ps = c === 'main' ? paginasDe(r, ini) : cambiadas(r, ini);
    return ps.length ? ps : paginasDe(r, ini);
  }
  function nombreRama(c) { var r = rama(c); return c === 'main' ? 'main' : r ? (r.tarea ? r.tarea + ' · ' : '') + (r.titulo || c) : c; }

  /** Lo que la rama trae de la base frente a lo que tiene cargado el Supabase de DEV de esa iniciativa. */
  function base(c, ini) {
    var r = rama(c), suyas = r && (r.migraciones || {})[ini], b = (datos.bases || {})[ini];
    if (!suyas || !b || !b.migraciones) return null;
    var faltan = suyas.filter(function (m) { return b.migraciones.indexOf(m) < 0; });
    return faltan.length ? { cargada: b.rama === c ? 'una versión anterior de esta rama' : 'la de ' + (b.rama || 'otra rama') } : null;
  }

  /* ---------- la elección ---------- */

  /** La elección de ahora, completa y válida con lo que hay en ramas.json (lo que falta: lo de antes o lo primero). */
  function eleccion() {
    var E = leer(), x = Object.assign({}, E.eleccion || {});
    var inis = iniciativas();
    if (inis.indexOf(x.ini) < 0) x.ini = inis[0] || '';
    if (!x.carpeta || !rama(x.carpeta) || !paginasDe(rama(x.carpeta), x.ini).length) {
      x.carpeta = rama('main') && paginasDe(rama('main'), x.ini).length ? 'main' : (ramasDe(x.ini).suyas[0] || '');
    }
    var ws = webs(x.carpeta, x.ini);
    if (!ws.some(function (p) { return p.ruta === x.ruta; })) x.ruta = ws[0] ? ws[0].ruta : '';
    if (!x.como || (x.como.tipo === 'prueba' && x.como.ini !== x.ini)) x.como = ((E.comoDe || {})[x.ini]) || { tipo: 'yo' };
    return x;
  }
  /** Cambia una parte de la elección; lo que depende de ella vuelve a lo de antes o a lo primero. */
  function elegir(cambio) {
    var E = leer(), antes = eleccion(), x = Object.assign({}, antes, cambio);
    if (cambio.ini && cambio.ini !== antes.ini) { delete x.carpeta; delete x.ruta; delete x.como; }
    if (cambio.carpeta && cambio.carpeta !== antes.carpeta && !cambio.ruta) {
      // La misma web si la nueva rama la tiene; si no, la primera que cambia.
      if (!webs(cambio.carpeta, x.ini).some(function (p) { return p.ruta === antes.ruta; })) delete x.ruta;
    }
    if (cambio.como) { E.comoDe = E.comoDe || {}; E.comoDe[x.ini] = cambio.como; }
    E.eleccion = x;
    guardar(E);
  }
  function pagina(x) { return webs(x.carpeta, x.ini).filter(function (p) { return p.ruta === x.ruta; })[0] || null; }
  function quienTexto(x, p) { return p && p.publica ? 'sin entrar' : x.como && x.como.tipo === 'prueba' ? (x.como.nombre || x.como.correo) + (x.como.rol ? ' · ' + x.como.rol : '') : 'Yo'; }
  function recienteTexto(x) {
    var p = pagina(x);
    return [nombre(x.ini), p ? p.nombre : x.ruta, x.carpeta === 'main' ? 'main' : (rama(x.carpeta) || {}).tarea || x.carpeta, quienTexto(x, p)].join(' · ');
  }

  /* ---------- las personas de prueba (personas_de_prueba de su Supabase de DEV) ---------- */

  function supabaseDe(ini) {
    var ps = [];
    Object.keys(datos.ramas || {}).forEach(function (c) { ps = ps.concat(paginasDe(datos.ramas[c], ini)); });
    var p = ps.filter(function (x) { return x.supabase && x.supabase.url; })[0];
    return p ? p.supabase : null;
  }
  function perfilesDe(ini) {
    var ps = [];
    Object.keys(datos.ramas || {}).forEach(function (c) { ps = ps.concat(paginasDe(datos.ramas[c], ini)); });
    var p = ps.filter(function (x) { return x.perfiles && x.perfiles.length; })[0];
    return (p && p.perfiles) || [];
  }
  /** Un rol para leer: «Capitana», «Responsable · KONAMIGAS». */
  function rolTexto(r) { return (r.nombre || r.rol) + (r.ambito && r.ambito !== 'todo' && r.ambito_id ? ' · ' + r.ambito_id : ''); }
  /** Su rol más alto (en el orden de los perfiles de la iniciativa), para la línea DEV. */
  function rolAlto(p, ini) {
    var orden = perfilesDe(ini), pos = function (r) { var i = orden.indexOf(r.rol); return i < 0 ? 98 : i; };
    var r = (p.roles || []).slice().sort(function (a, b) { return pos(a) - pos(b); })[0];
    return r ? rolesTexto({ roles: p.roles.filter(function (x) { return x.rol === r.rol; }) }) : 'Sin roles';
  }
  /** Sus roles, agrupados: «Árbitro · 4 partidos», «Gestor · 2 ligas y 1 partido», «Capitana · IE00001», «Admin». */
  var AMBITOS = { partido: ['partido', 'partidos'], liga: ['liga', 'ligas'], equipo: ['equipo', 'equipos'], inscripcion_equipo: ['equipo', 'equipos'],
    jugadora: ['ficha', 'fichas'], iniciativa: ['iniciativa', 'iniciativas'] };
  function rolesTexto(p) {
    if (!p.roles || !p.roles.length) return 'Sin roles';
    var por = {}, orden = [];
    p.roles.forEach(function (r) {
      var n = r.nombre || r.rol;
      if (!por[n]) { por[n] = []; orden.push(n); }
      if (r.ambito && r.ambito !== 'todo' && r.ambito_id) por[n].push(r);
    });
    return orden.map(function (n) {
      var rs = por[n];
      if (!rs.length) return n;
      if (rs.length === 1) return n + ' · ' + rs[0].ambito_id;
      var cuenta = {}, tipos = [];
      rs.forEach(function (r) { if (!cuenta[r.ambito]) { cuenta[r.ambito] = 0; tipos.push(r.ambito); } cuenta[r.ambito]++; });
      var partes = tipos.map(function (t) { var w = AMBITOS[t] || ['ámbito', 'ámbitos']; return cuenta[t] + ' ' + w[cuenta[t] === 1 ? 0 : 1]; });
      return n + ' · ' + (partes.length > 1 ? partes.slice(0, -1).join(', ') + ' y ' + partes[partes.length - 1] : partes[0]);
    }).join(', ');
  }
  function cargarPersonas(ini) {

    var vueltas = 0;

        .then(function (b) { return b.json().catch(function () { return null; }).then(function (j) { return { ok: b.ok, j: j }; }); })
        .then(function (b) {

    return auth(d, 'token?grant_type=pkce', { auth_code: codigo, code_verifier: v }).then(function (r) {
      if (r.ok && r.j.access_token) { ponerLS(d.sesion, JSON.stringify(sesionDe(r.j))); tareas = {}; }
      else aviso('No se ha podido entrar en el DAILY (' + ((r.j && (r.j.msg || r.j.error_description || r.j.message)) || r.status) + ').', true);
    }, function () { aviso('No se ha podido entrar en el DAILY: sin conexión.', true); });
  }

  function pintarIniciativa() {
    var x = eleccion(), todas = iniciativas();
    cabecera('Iniciativa', '', true);
    pie.hidden = true;
    var inis = todas.filter(function (i) { return coincide(nombre(i), i); });
    hoja.innerHTML = (todas.length > 6 ? buscador('Buscar iniciativa') : '') + (inis.length ? '<div class="grupo">' + inis.map(function (i) {
      var n = ramasDe(i).suyas.length, el = i === x.ini;
      return '<button type="button" class="fila' + (el ? ' elegida' : '') + '" data-ini="' + texto(i) + '"><span class="que"><span class="nombre">' + texto(nombre(i)) + '</span>' +
        '<span class="dato">' + (n ? n + (n === 1 ? ' rama abierta' : ' ramas abiertas') + ' y main' : 'Solo main') + '</span></span>' + (el ? ICONOS.si : '') + '</button>';
    }).join('') + '</div>' : '<p class="nota">Ninguna con ese nombre.</p>');
  }

  function filaRama(c, x, todas) {
    var r = rama(c), ws = todas ? paginasDe(r, x.ini) : webs(c, x.ini), el = c === x.carpeta;
    var dato = c === 'main' ? 'Lo fusionado, aún sin publicar · todas las webs'
      : [r.tarea, hace(r.fecha), ws.map(function (w) { return w.nombre; }).join(', '), r.quien && r.quien !== 'Javi Canela' ? r.quien : ''].filter(Boolean).join(' · ');
    var falta = c !== 'main' && base(c, x.ini) ? '<span class="falta">Necesita cargar su base</span>' : '';
    return '<button type="button" class="fila' + (el ? ' elegida' : '') + '" data-rama="' + texto(c) + '"><span class="que"><span class="nombre">' +
      texto(c === 'main' ? 'main' : r.titulo || c) + '</span><span class="dato">' + texto(dato) + '</span>' + falta + '</span>' + (el ? ICONOS.si : '') + '</button>';
  }
  function pintarRama() {
    var x = eleccion();
    cabecera('Rama', nombre(x.ini), true);
    pie.hidden = true;
    var rs = ramasDe(x.ini), ok = function (c) { var r = rama(c); return coincide(c, r.tarea, r.titulo); };
    var h = buscador('Buscar tarea o T0…');
    if (rama('main') && paginasDe(rama('main'), x.ini).length && ok('main')) h += '<div class="grupo">' + filaRama('main', x, true) + '</div>';
    var suyas = rs.suyas.filter(ok), otras = rs.otras.filter(ok);
    h += '<div><p class="titulo">Ramas abiertas</p>' + (suyas.length ? '<div class="grupo">' + suyas.map(function (c) { return filaRama(c, x); }).join('') + '</div>'
      : '<p class="nota">' + (filtro ? 'Ninguna con eso.' : 'Ninguna rama abierta cambia ' + texto(nombre(x.ini)) + '.') + '</p>') + '</div>';
    if (otras.length) {
      h += verTodas || filtro ? '<div><p class="titulo">No cambian ' + texto(nombre(x.ini)) + '</p><div class="grupo">' + otras.map(function (c) { return filaRama(c, x, true); }).join('') + '</div></div>'
        : '<button type="button" class="mas" data-mas="1">Ver ' + otras.length + (otras.length === 1 ? ' rama más que no cambia ' : ' ramas más que no cambian ') + texto(nombre(x.ini)) + '</button>';
    }
    hoja.innerHTML = h;
  }

  function pintarComo() {
    var x = eleccion(), yo = quienDe(x) === 'yo';
    cabecera('Entrar como', nombre(x.ini), true);
    pie.hidden = true;
    cargarPersonas(x.ini);
    var P = personas[x.ini] || {};
    var h = buscador('Buscar persona o rol') + '<div class="grupo"><button type="button" class="fila' + (yo ? ' elegida' : '') + '" data-yo="1"><span class="avatar" aria-hidden="true">Yo</span>' +
      '<span class="que"><span class="nombre">Yo</span><span class="dato">Con Google · tus roles de verdad en DEV</span></span>' + (yo ? ICONOS.si : '') + '</button></div>';
    h += '<div><p class="titulo">Personas de prueba · ' + texto(nombre(x.ini)) + '</p>';
    hoja._personas = [];
    if (P.cargando) h += '<p class="nota">Cargando…</p>';
    else if (P.error) h += '<p class="aviso">' + ICONOS.aviso + '<span>' + texto(P.error) + '</span></p>';
    else {
      var l = (P.lista || []).filter(function (p) { return coincide(p.nombre, p.correo, rolesTexto(p)); });
      h += l.length ? '<div class="grupo">' + l.map(function (p, i) {
        var el = !yo && x.como.correo === p.correo;
        return '<button type="button" class="fila' + (el ? ' elegida' : '') + '" data-persona="' + i + '"><span class="que"><span class="nombre">' + texto(p.nombre) + '</span>' +
          '<span class="dato">' + texto(rolesTexto(p)) + '</span></span>' + (el ? ICONOS.si : '') + '</button>';
      }).join('') + '</div>' : '<p class="nota">' + (filtro ? 'Nadie con eso.' : 'Esta iniciativa no tiene personas de prueba.') + '</p>';
      hoja._personas = l;
    }
    h += '</div><p class="nota">Las personas y sus roles salen de los datos de prueba de cada iniciativa (solo correos @ejemplo.com). Se entra sin escribir el código: la app lo lee del buzón de pruebas de DEV.</p>';
    hoja.innerHTML = h;
  }

  function pintar() {
    if (!datos) return;
    var foco = document.activeElement && document.activeElement.id === 'buscar';
    ({ iniciativa: pintarIniciativa, rama: pintarRama, como: pintarComo }[vista] || pintarProbar)();
    if (foco) { var i = document.getElementById('buscar'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }
  /** A una lista (iniciativa, rama, como): con su paso en el historial, para que «atrás» del móvil vuelva a la hoja. */
  function ir(v) {
    if (v === 'como') { var ini = eleccion().ini; if (personas[ini] && personas[ini].error) delete personas[ini]; }
    vista = v; filtro = ''; verTodas = false; aviso(''); history.pushState({ v: v }, '', location.pathname + location.search + '#' + v); window.scrollTo(0, 0); pintar(); }
  function atras() { if (vista !== 'probar') history.back(); }

  /* ---------- eventos ---------- */

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-cerrar')) { var u = leer().ultima; if (u) location.assign(u); return; }
    if (b.hasAttribute('data-atras')) return atras();
    if (b.getAttribute('data-ir')) return ir(b.getAttribute('data-ir'));
    if (b.hasAttribute('data-web')) { elegir({ ruta: b.getAttribute('data-web') }); pintar(); return; }
    if (b.hasAttribute('data-reciente')) { var y = hoja._recientes[+b.getAttribute('data-reciente')]; if (y) abrir(y); return; }
    if (b.hasAttribute('data-ini')) { elegir({ ini: b.getAttribute('data-ini') }); return atras(); }
    if (b.hasAttribute('data-rama')) { elegir({ carpeta: b.getAttribute('data-rama') }); return atras(); }
    if (b.hasAttribute('data-mas')) { verTodas = true; pintar(); return; }
    if (b.hasAttribute('data-daily-entrar')) { var d = daily(); if (d) aGoogle(d, d.sesion, location.href.replace(/[?#].*$/, '') + '?probar'); return; }
    if (b.hasAttribute('data-pedir-cambios')) { pedirCambios(b.getAttribute('data-pedir-cambios')); return; }
    if (b.hasAttribute('data-yo')) { elegir({ como: { tipo: 'yo' } }); return atras(); }
    if (b.hasAttribute('data-persona')) {
      var p = hoja._personas[+b.getAttribute('data-persona')];
      if (p) { elegir({ como: { tipo: 'prueba', ini: eleccion().ini, correo: p.correo, nombre: p.nombre, rol: rolAlto(p, eleccion().ini) } }); atras(); }
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'buscar') { filtro = ev.target.value; pintar(); }
    if (ev.target.id === 'cambios-texto') { var r = rama(eleccion().carpeta); if (r && tareas[r.tarea]) tareas[r.tarea].borrador = ev.target.value; }
  });
  btnAbrir.addEventListener('click', function () { abrir(eleccion()); });
  window.addEventListener('popstate', function () { vista = location.hash.slice(1) || 'probar'; filtro = ''; verTodas = false; pintar(); });
  // Al volver a la app (desde otra, o atrás desde una rama), la lista al día y lo que se haya renovado dentro.
  window.addEventListener('pageshow', function (e) { if (e.persisted) { ocupado = false; tareas = {}; recogerSesion(); cargar(); } });

  function cargar() {
    return fetch('ramas.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        // El móvil guarda la página 10 minutos: si hay una app más nueva, se carga con otra dirección (no la guardada).
        if (j.selector && j.selector !== VERSION && VERSION.indexOf('__') && location.search.indexOf('v=' + j.selector) < 0) {
          var q = location.search.replace(/([?&])v=[^&]*&?/, '$1').replace(/[?&]$/, ''); // con lo que pedía el enlace (T0450)
          location.replace(location.pathname + (q ? q + '&' : '?') + 'v=' + j.selector);
          return;
        }
        datos = { ramas: j.ramas || {}, bases: j.bases || {}, daily: j.daily || null };
        // Al abrir la app: vuelve donde se dejó (la página de una rama que sigue subida), salvo si se ha venido a elegir.
        var u = leer().ultima, c = u && (/\/dev-ramas\/([^/]+)\//.exec(u) || [])[1];
        if (primera && !PROBAR && c && u.indexOf(location.pathname) === 0 && rama(decodeURIComponent(c))) { location.replace(u); return; }
        primera = false;
        return canjearCodigo().then(function () { if (!verPedido()) pintar(); });
      })
      .catch(function () { cabecera('Probar en DEV'); hoja.innerHTML = '<p class="vacio">No se puede leer la lista de ramas. Comprueba la conexión y vuelve a abrir la app.</p>'; });
  }

  recogerSesion();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search); // al recargar, a la hoja principal
  cargar();
})();
</script>
</body>
</html>
